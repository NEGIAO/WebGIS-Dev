services:
  api:
    image: negiao/webgis_dev:latest
    build: .
    ports:
      - "7860:7860"
    volumes:
      - .:/app # 关键：将本地代码实时映射到容器
      - /app/.venv # 可选：防止本地虚拟环境覆盖容器内的环境
      # 根目录 .env（部署基线）与 .env.local（本地开发覆盖）均挂载进容器，
      # 由 config.load_project_env() 根据 APP_ENV 二选一读取；系统环境变量仍优先。
      # 注意：两个文件均需存在（LocalDev.bat 会自动生成 .env）。
      - ../.env:/app/.env:ro
      - ../.env.local:/app/.env.local:ro
    environment:
      - PYTHONUNBUFFERED=1
      - APP_ENV=development
    # 覆盖 Dockerfile 的 CMD，确保开启 --reload
    command: uv run uvicorn app:app --host 0.0.0.0 --port 7860 --reload