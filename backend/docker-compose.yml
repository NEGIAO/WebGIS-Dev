services:
  api:
    image: negiao/webgis_dev:latest
    build: .
    ports:
      - "7860:7860"
    volumes:
      - .:/app # 关键：将本地代码实时映射到容器
      - /app/.venv # 可选：防止本地虚拟环境覆盖容器内的环境
      # 根目录 .env（L1 本地实值：OAuth 密钥、SMTP 等）挂载进容器，
      # 由 config.load_project_env() 启动时读取；系统环境变量仍优先。
      # 注意：需存在根 .env（LocalDev.bat 会自动生成），重建容器后生效。
      - ../.env:/.env:ro
    environment:
      - PYTHONUNBUFFERED=1
      - APP_ENV=development
    # 覆盖 Dockerfile 的 CMD，确保开启 --reload
    command: uv run uvicorn app:app --host 0.0.0.0 --port 7860 --reload