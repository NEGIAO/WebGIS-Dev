<!doctype html>
<html lang="zh-CN">
    <!--    
        NEGIAO's WebGIS
        联系作者：1482918576
        GitHub: https://github.com/NEGIAO
-->

    <head>
        <meta charset="UTF-8" />
        <!-- 隐藏 Referer 信息避免被跟踪 -->
        <!-- <meta name="referrer" content="no-referrer"> -->
        <!-- 品牌 icon.webp 全站唯一网络请求：preload 提前触发，
             favicon 与首屏 logo <img> 均命中同一缓存响应 -->
        <link
            rel="preload"
            href="./images/icon.webp"
            as="image"
            type="image/webp"
        />
        <link
            rel="icon"
            href="./images/icon.webp"
            type="image/webp"
        />
        <!-- 自定义网页的logo：favicon / LandingView / TopBar / RegisterView 共用同一资源 -->

        <meta
            name="viewport"
            content="width=device-width, initial-scale=1"
        />
        <!-- 多设备自适应 -->

        <!-- Font Awesome (BootCDN 加速国内访问)
             media="print" + onload 交换:CSS 异步加载不阻塞首屏渲染(图标可能晚到约百毫秒);
             noscript 兜底保证无 JS 环境仍能加载图标样式 -->
        <link
            rel="stylesheet"
            href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css"
            media="print"
            onload="this.media='all'; this.onload=null;"
        />
        <noscript>
            <link
                rel="stylesheet"
                href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css"
            />
        </noscript>

        <!-- 关键资源预加载：减少首屏渲染等待 -->
        <link rel="preconnect" href="https://cdn.bootcdn.net" crossorigin />
        <!-- Cesium CDN 预连接（仅握手，不下载资源，不阻塞首屏） -->
        <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

        <title>NEGIAO's WebGIS</title>
        <!-- Google Identity Services (One Tap / Sign In With Google) -->
        <script src="https://accounts.google.com/gsi/client" async defer></script>
    </head>

    <body>
        <div id="app"></div>
        <script
            type="module"
            src="./src/main.js"
        ></script>
        <!-- 导入js文件 -->

        <script defer src="/min-enhanced.js"></script>
        <!--
        导入增强功能的js文件（51.la立即执行，其他延迟3秒 ）
        defer：不阻塞 HTML 解析，DOMContentLoaded 前按顺序执行
        该文件不在本仓库，位于个人主页index.html同级目录：negiao/negiao.github.io/WebGIS/min-enhanced.js
     -->
    </body>
</html>
