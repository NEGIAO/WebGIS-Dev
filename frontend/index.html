<!doctype html>
<html lang="zh-CN">
    <!--    
        NEGIAO's WebGIS
        联系作者：yaonaigao@qq.com
        GitHub: https://github.com/NEGIAO
        update:2026-10-31
        Version: 3.6.35
-->

    <head>
        <meta charset="UTF-8" />
        <!-- 隐藏 Referer 信息避免被跟踪 -->
        <!-- <meta name="referrer" content="no-referrer"> -->
        <!-- 品牌 icon.webp 同时作为 favicon 与首屏 logo <img>；
             二者同为同源请求，浏览器 HTTP 缓存会共享同一条响应，无需额外 preload。
             preload 因 credentials mode 与 favicon 不匹配反而产生一次冗余请求并触发
             控制台告警，已于 V3.6.35 移除（实测 icon 由 3 次请求降为缓存共享）。 -->
        <link
            rel="icon"
            href="./images/icon.webp"
            type="image/webp"
        />
        <!-- 自定义网页的logo：favicon / LandingView / TopBar / RegisterView 共用同一资源 -->

        <!-- LCP 纹样图预加载：该图作为 <img src> 由组件挂载后才出现，
             初始 HTML 不可发现，性能追踪实测造成约 480ms 的资源加载延迟。
             按断点分别预加载（仅命中其一），fetchpriority=high 提升抓取优先级。 -->
        <link
            rel="preload"
            href="./images/njnu-media/d-bg2_1.png"
            as="image"
            type="image/png"
            fetchpriority="high"
            media="(min-width: 768px)"
        />

        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
        />
        <!-- 多设备自适应：shrink-to-fit=no 禁止 iOS Safari 在横向溢出时整页缩小（F12 模拟不会复现该行为）；
             viewport-fit=cover 适配刘海屏安全区 -->

        <!-- Font Awesome 6.4.0（BootCDN，国内节点）
             2026-11 回退：V3.6.35 曾改为自托管（public/fontawesome/，该目录已于 V3.6.40 删除），
             但自托管走的是本站源（GitHub Pages），国内访问反而比 BootCDN 慢，
             故改回 CDN。CSS 与字体同源于 cdn.bootcdn.net，一次 DNS 解析内并行取回。
             media="print" + onload 交换：CSS 异步加载不阻塞首屏（图标可能晚到约百毫秒）；
             noscript 兜底保证无 JS 环境仍能加载图标样式。 -->
        <link
            rel="preconnect"
            href="https://cdn.bootcdn.net"
            crossorigin
        />
        <link
            rel="stylesheet"
            href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css"
            media="print"
            onload="this.media='all'; this.onload=null;"
        />
        <noscript>
            <link
                rel="stylesheet"
                href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css"
            />
        </noscript>

        <title>NEGIAO's WebGIS</title>
        <!-- Google Identity Services 不在此处加载：
             V3.6.35 起改由 RegisterView.vue 的 ensureGsiScript() 按需注入（仅登录/注册页），
             本文件曾遗留一个 async 的 <script>，会让落地页/地图页等无关页面
             也去连 accounts.google.com（国内不可达，白占连接槽并拖 load）。
             如需恢复预加载，先确认这一点是否仍成立。 -->
    </head>

    <body>
        <div id="app"></div>
        <script
            type="module"
            src="./src/main.js"
        ></script>
        <!-- 导入js文件 -->

        <script defer src="/min-enhanced.js"></script>
        <!--
        导入增强功能的js文件（51.la立即执行，其他延迟3秒 ）
        defer：不阻塞 HTML 解析，DOMContentLoaded 前按顺序执行
        该文件不在本仓库，位于个人主页index.html同级目录：negiao/negiao.github.io/WebGIS/min-enhanced.js
     -->
    </body>
</html>
