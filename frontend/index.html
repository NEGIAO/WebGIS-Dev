<!doctype html>
<html lang="zh-CN">
    <!--    
        NEGIAO's WebGIS
        联系作者：yaonaigao@qq.com

        update:2026-11-17
        Version: 3.7.4
-->

    <head>
        <meta charset="UTF-8" />
        <link
            rel="icon"
            href="./images/icon.webp"
            type="image/webp"
        />

        <link
            rel="preload"
            href="./images/njnu-media/d-bg2_1.png"
            as="image"
            type="image/png"
            fetchpriority="high"
            media="(min-width: 768px)"
        />

        <!-- 多设备自适应-->
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
        />

        <!-- 字体使用CDN加速，不要自托管 -->
        <link
            rel="preload"
            href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/webfonts/fa-solid-900.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />

        <style>
            /* FA6 主字体族 */
            @font-face {
                font-family: 'Font Awesome 6 Brands';
                font-style: normal;
                font-weight: 400;
                font-display: swap;
                src: url('https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/webfonts/fa-brands-400.woff2')
                    format('woff2');
            }
            @font-face {
                font-family: 'Font Awesome 6 Free';
                font-style: normal;
                font-weight: 400;
                font-display: swap;
                src: url('https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/webfonts/fa-regular-400.woff2')
                    format('woff2');
            }
            @font-face {
                font-family: 'Font Awesome 6 Free';
                font-style: normal;
                font-weight: 900;
                font-display: swap;
                src: url('https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/webfonts/fa-solid-900.woff2')
                    format('woff2');
            }
            /* FA5 兼容字体族 */
            @font-face {
                font-family: 'Font Awesome 5 Brands';
                font-style: normal;
                font-weight: 400;
                font-display: swap;
                src: url('https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/webfonts/fa-brands-400.woff2')
                    format('woff2');
            }
            @font-face {
                font-family: 'Font Awesome 5 Free';
                font-style: normal;
                font-weight: 400;
                font-display: swap;
                src: url('https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/webfonts/fa-regular-400.woff2')
                    format('woff2');
            }
            @font-face {
                font-family: 'Font Awesome 5 Free';
                font-style: normal;
                font-weight: 900;
                font-display: swap;
                src: url('https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/webfonts/fa-solid-900.woff2')
                    format('woff2');
            }
        </style>

        <title>NEGIAO's WebGIS - 地理信息可视化平台</title>

        <!-- SEO与首屏过渡 -->
        <style>
            html,
            body {
                margin: 0;
                padding: 0;
                height: 100%;
                background: #e8f5e9;
                color: #333;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            }
            #app:not(:empty) > header.boot-screen {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 18px;
                text-align: center;
                background: radial-gradient(circle at 50% 40%, #ffffff 0%, #e8f5e9 70%);
            }
            #app > header.boot-screen .boot-logo-wrap {
                width: 96px;
                height: 96px;
                border-radius: 50%;
                background: #4caf50;
                box-shadow: 0 6px 20px rgba(46, 125, 50, 0.18);
                display: flex;
                align-items: center;
                justify-content: center;
                animation: boot-pulse 1.6s ease-in-out infinite;
            }
            #app > header.boot-screen .boot-logo {
                width: 74px;
                height: 60px;
                object-fit: contain;
                display: block;
            }
            #app > header.boot-screen h1 {
                margin: 0;
                font-size: 22px;
                font-weight: 600;
                color: #2e7d32;
                letter-spacing: 0.5px;
            }
            #app > header.boot-screen .boot-status {
                margin: 0;
                font-size: 13px;
                color: #5b6b5e;
            }
            #app > header.boot-screen .boot-seo {
                position: absolute;
                width: 1px;
                height: 1px;
                overflow: hidden;
                clip: rect(0 0 0 0);
                clip-path: inset(50%);
                white-space: nowrap;
            }
            #app > header.boot-screen .boot-spinner {
                width: 38px;
                height: 38px;
                border: 3px solid #c8e6c9;
                border-top-color: #4caf50;
                border-radius: 50%;
                animation: boot-spin 0.9s linear infinite;
            }
            @keyframes boot-spin {
                to {
                    transform: rotate(360deg);
                }
            }
            @keyframes boot-pulse {
                0%,
                100% {
                    opacity: 1;
                    transform: scale(1);
                }
                50% {
                    opacity: 0.75;
                    transform: scale(0.94);
                }
            }
            @media (prefers-reduced-motion: reduce) {
                #app > header.boot-screen .boot-logo-wrap,
                #app > header.boot-screen .boot-spinner {
                    animation: none;
                }
            }
        </style>
        <noscript>
            <style>
                #app > header.boot-screen {
                    position: static !important;
                    display: block !important;
                    background: #fff !important;
                    padding: 24px !important;
                }
                #app > header.boot-screen .boot-seo {
                    position: static !important;
                    width: auto !important;
                    height: auto !important;
                    overflow: visible !important;
                    clip: auto !important;
                    clip-path: none !important;
                    white-space: normal !important;
                }
                #app > header.boot-screen .boot-spinner,
                #app > header.boot-screen .boot-logo-wrap {
                    display: none !important;
                }
            </style>
        </noscript>

        <!-- SEO 元信息 -->
        <meta
            name="description"
            content="NEGIAO's WebGIS 是一个开源的二维/三维一体化地理信息可视化平台：基于 Vue 3 + OpenLayers + Cesium，支持三维地球漫游、地形与影像加载、矢量/栅格数据导入（SHP/KML/GeoJSON/GeoTIFF/GLTF）、建筑白模、空间分析与在线地图服务聚合。"
        />
        <meta
            name="keywords"
            content="WebGIS,三维地图,地理信息系统,GIS可视化,Cesium,OpenLayers,地图开发,地形,空间分析,倾斜摄影,数字地球"
        />
        <meta
            name="author"
            content="NEGIAO"
        />
        <link
            rel="canonical"
            href="https://webgis.negiao.cn/"
        />

        <!-- Open Graph / 社交分享卡片 -->
        <meta
            property="og:type"
            content="website"
        />
        <meta
            property="og:site_name"
            content="NEGIAO's WebGIS"
        />
        <meta
            property="og:title"
            content="NEGIAO's WebGIS - 三维地理信息可视化平台"
        />
        <meta
            property="og:description"
            content="基于 Vue 3 + OpenLayers + Cesium 的二维/三维一体化 WebGIS 平台：三维漫游、地形影像、矢量栅格导入、建筑白模与空间分析。"
        />
        <meta
            property="og:url"
            content="https://webgis.negiao.cn/"
        />
        <meta
            property="og:image"
            content="https://webgis.negiao.cn/images/icon.webp"
        />
        <meta
            name="twitter:card"
            content="summary_large_image"
        />
        <meta
            name="twitter:title"
            content="NEGIAO's WebGIS - 三维地理信息可视化平台"
        />
        <meta
            name="twitter:description"
            content="基于 Vue 3 + OpenLayers + Cesium 的二维/三维一体化 WebGIS 平台。"
        />
        <meta
            name="twitter:image"
            content="https://webgis.negiao.cn/images/icon.webp"
        />
    </head>

    <body>
        <!-- 首屏静态兜底内容（爬虫/无 JS/弱网可见；Vue 挂载时整体替换，正常用户几乎无感）。 -->
        <div id="app">
            <header class="boot-screen">
                <div class="boot-logo-wrap">
                    <img
                        class="boot-logo"
                        src="./images/icon.webp"
                        alt="NEGIAO's WebGIS"
                    />
                </div>
                <h1>NEGIAO's WebGIS</h1>
                <div
                    class="boot-spinner"
                    role="status"
                    aria-label="正在加载"
                ></div>
                <p class="boot-status">正在加载地理信息可视化平台…</p>
                <!-- SEO 文本：视觉隐藏但保留在 DOM，供搜索引擎抓取 -->
                <div class="boot-seo">
                    <h2>三维地理信息可视化平台</h2>
                    <p>
                        这是一个基于 Vue 3 + OpenLayers + Cesium 构建的开源二维 / 三维一体化 WebGIS
                        平台，提供三维地球漫游、地形与影像底图、矢量与栅格数据导入 （SHP / KML /
                        GeoJSON / GeoTIFF / GLTF / 3D Tiles）、建筑白模、
                        卷帘对比、空间分析与在线地图服务（WMS / WMTS / ArcGIS）聚合等能力。
                    </p>
                    <nav>
                        <ul>
                            <li><a href="/">首页 / 地图工作台</a></li>
                            <li><a href="/#/terms">服务条款</a></li>
                            <li><a href="/#/privacy">隐私政策</a></li>
                        </ul>
                    </nav>
                </div>
            </header>
        </div>

        <!-- 导入SPA js文件 -->
        <script
            type="module"
            src="./src/main.ts"
        ></script>
        

        <!--
        导入51LA依赖
        defer：不阻塞 HTML 解析，DOMContentLoaded 前按顺序执行
     -->
        <script
            defer
            src="/min-enhanced.js"
        ></script>
    </body>
</html>
