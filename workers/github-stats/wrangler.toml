# WebGIS-Dev GitHub 开源数据边缘 API（Cloudflare Worker）
# 部署：本目录执行 npx wrangler login && npx wrangler deploy
# 部署成功后，把输出的 https://xxx.workers.dev 填到 deploy/.env 的 VITE_GITHUB_STATS_WORKER_URL
name = "webgis-github-stats"
main = "src/index.js"
compatibility_date = "2025-08-01"

# 每 15 分钟暖一次 /api/stats 缓存（免费计划可用；面试当天缓存必热）
[triggers]
crons = ["*/15 * * * *"]

# 敏感配置不进 git，用 secret 设置（可选，但推荐 GITHUB_TOKEN）：
#   npx wrangler secret put GITHUB_TOKEN               # GitHub API 限额 60/h → 5000/h
#   npx wrangler secret put STAR_HISTORY_SEALED_TOKEN  # 轮换 star-history 授权时用

# 自定义域名（可选）：Cloudflare Dashboard → Workers → webgis-github-stats
# → Settings → Domains & Routes → Add Custom Domain（如 api.negiao.cn）；
# 之后把 deploy/.env 的 VITE_GITHUB_STATS_WORKER_URL 改成 https://api.negiao.cn
