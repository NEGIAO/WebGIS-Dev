<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>淹没分析</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cesium@1.140.0/Build/Cesium/Cesium.js"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/cesium@1.140.0/Build/Cesium/Widgets/widgets.css"
      rel="stylesheet"
    />
    <style>
      html,
      body,
      #app,
      #cesiumContainer {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
      }

      .lil-gui {
        top: 10px;
        left: 10px;
        z-index: 999;
      }

      .status-panel {
        position: absolute;
        left: 10px;
        bottom: 10px;
        z-index: 998;
        min-width: 260px;
        padding: 10px 12px;
        border-radius: 6px;
        color: #e8f1ff;
        background: rgba(12, 18, 28, 0.78);
        font-size: 13px;
        line-height: 1.7;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="cesiumContainer"></div>
      <div class="status-panel">{{ statusText }}</div>
    </div>

    <script type="module">
      const { createApp } = Vue;
      import GUI from "https://cdn.jsdelivr.net/npm/lil-gui@0.19.1/dist/lil-gui.esm.js";

      // ============================================================
      // 淹没分析核心类（移植自 SubmergenceAnalysis.js）
      // ============================================================
      class SubmergenceAnalysis {
        constructor(option) {
          this.viewer = option.viewer;
          this.targetHeight = option.targetHeight ?? 10;
          this.startHeight = option.startHeight ?? 0;
          this.waterHeight = option.waterHeight ?? this.startHeight;
          this.adapCoordi = option.adapCoordi ?? [0, 0, 0, 0, 0, 0];
          this.speed = option.speed ?? 1;
          this.color = option.color ?? Cesium.Color.fromBytes(64, 157, 253, 100);
          this.changetype = option.changetype ?? "up";
          this.speedCallback = option.speedCallback ?? (() => {});
          this.endCallback = option.endCallback ?? (() => {});
          this.polygonEntity = null;
          this.timer = null;
          if (this.viewer) {
            this.createEntity();
            this.updatePoly(this.adapCoordi);
          }
        }

        createEntity() {
          if (this.polygonEntity && this.polygonEntity.length > 0) {
            for (let entity of this.polygonEntity) {
              this.viewer.entities.remove(entity);
            }
          }
          this.polygonEntity = [];
          let nEntity = this.viewer.entities.add({
            polygon: {
              hierarchy: {},
              material: this.color,
            },
          });
          nEntity.polygon.extrudedHeight = new Cesium.CallbackProperty(
            () => this.waterHeight,
            false,
          );
          this.polygonEntity.push(nEntity);
        }

        updatePoly(adapCoordi) {
          this.adapCoordi = this.coordsTransformation(adapCoordi);
          if (this.polygonEntity && this.polygonEntity.length > 0) {
            this.polygonEntity[0].polygon.hierarchy = new Cesium.PolygonHierarchy(
              this.adapCoordi,
            );
          }
        }

        coordsTransformation(coords) {
          if (typeof coords[0] === "number" && typeof coords[1] === "number") {
            if (
              coords[0] < 180 && coords[0] > -180 &&
              coords[1] < 90 && coords[1] > -90
            ) {
              return Cesium.Cartesian3.fromDegreesArray(coords);
            } else {
              return Cesium.Cartesian3.fromArray(coords);
            }
          }
          let c = [];
          for (let i = 0; i < coords.length; i++) {
            let point = coords[i];
            if (point.lng) {
              c.push(Cesium.Cartesian3.fromDegrees(point.lng, point.lat));
            } else if (point.x !== undefined) {
              if (
                point.x < 180 && point.x > -180 &&
                point.y < 90 && point.y > -90
              ) {
                c.push(Cesium.Cartesian3.fromDegrees(point.x, point.y));
              } else {
                c.push(point);
              }
            }
          }
          return c;
        }

        start() {
          this.timer = window.setInterval(() => {
            let sp = this.speed / 50;
            if (this.changetype === "up") {
              this.waterHeight += sp;
              if (this.waterHeight >= this.targetHeight) {
                this.waterHeight = this.targetHeight;
                window.clearInterval(this.timer);
                this.timer = null;
                this.endCallback();
              }
            } else {
              this.waterHeight -= sp;
              if (this.waterHeight <= this.targetHeight) {
                this.waterHeight = this.targetHeight;
                window.clearInterval(this.timer);
                this.timer = null;
                this.endCallback();
              }
            }
            this.speedCallback(this.waterHeight);
          }, 20);
        }

        clear() {
          if (this.timer) {
            window.clearInterval(this.timer);
            this.timer = null;
          }
          this.waterHeight = this.startHeight;
          if (this.polygonEntity) {
            for (let entity of this.polygonEntity) {
              this.viewer.entities.remove(entity);
            }
          }
          this.polygonEntity = null;
        }
      }

      // ============================================================
      // Vue 应用
      // ============================================================
      createApp({
        data() {
          return {
            viewer: null,
            imageryLayer: null,
            analysis: null,
            // 矩形绘制状态
            drawHandler: null,
            drawRafId: null,              // requestAnimationFrame ID
            drawPendingPos: null,         // 待处理的鼠标位置
            firstCartesian: null,
            currentRectangle: null,       // Cesium.Rectangle
            currentPreviewRectangle: null,// 绘制中实时更新的矩形
            previewEntity: null,          // 绘制中的预览矩形
            // 完成绘制的多边形坐标（扁平 lon/lat 数组，矩形四角闭合）
            currentPolygonCoords: null,
            statusText: "点击「绘制淹没区域」，左键选择矩形两个对角点。",
            params: {
              startHeight: 1000,
              targetHeight: 2000,
              speed: 150,
              color: [0.25, 0.62, 0.99],   // lil-gui 用 0-1 范围
              direction: "up",
              currentHeight: 0,
              autoAnalyze: true,
              drawPolygon: () => this.startRectangleDraw(),
              startFlood: () => this.startAnalysis(),
              clear: () => this.clearAll(),
              resetCamera: () => this.resetCamera(),
            },
            isRunning: false,
          };
        },

        async mounted() {
          this.initMap();
          this.addlilgui();
        },

        beforeUnmount() {
          this.cancelDraw();
          this.clearAnalysis();
          if (this.myLilGui) {
            this.myLilGui.destroy();
            this.myLilGui = null;
          }
        },

        methods: {
          initMap() {
            let viewer = new Cesium.Viewer("cesiumContainer", {
              baseLayer: false,
              animation: false,
              timeline: false,
              fullscreenButton: false,
              infoBox: false,
              geocoder: false,
              homeButton: false,
              sceneModePicker: false,
              baseLayerPicker: false,
              navigationHelpButton: false,
              selectionIndicator: false,
              shouldAnimate: true,
            });

            window.viewer = viewer;
            this.viewer = viewer;
            viewer.scene.debugShowFramesPerSecond = true;
            viewer.scene.globe.enableLighting = false;
            viewer.scene.fog.enabled = true;
            viewer.scene.fog.density = 0.00008;
            viewer.scene.skyAtmosphere.show = true;
            viewer._cesiumWidget._creditContainer.style.display = "none";

            // 加载地形（淹没分析需要真实地形）
            Cesium.ArcGISTiledElevationTerrainProvider.fromUrl(
              "https://elevation3d.arcgis.com/arcgis/rest/services/WorldElevation3D/Terrain3D/ImageServer",
            ).then((provider) => {
              viewer.terrainProvider = provider;
            });
            viewer.scene.globe.depthTestAgainstTerrain = true;

            let imageryLayer = viewer.imageryLayers.addImageryProvider(
              new Cesium.UrlTemplateImageryProvider({
                url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
                maximumLevel: 18,
              }),
            );

            this.imageryLayer = imageryLayer;
            this.resetCamera();
          },

          addlilgui() {
            let myLilGui = new GUI();
            this.myLilGui = myLilGui;

            // ---- 绘制 ----
            let drawFolder = myLilGui.addFolder("绘制区域");
            drawFolder.add(this.params, "drawPolygon").name("绘制淹没区域");
            drawFolder.add(this.params, "autoAnalyze")
              .name("绘制完成后自动分析");

            // ---- 淹没参数 ----
            let floodFolder = myLilGui.addFolder("淹没参数");
            floodFolder.add(this.params, "startHeight", 0, 5000, 10).name("起始高度 (m)");
            floodFolder.add(this.params, "targetHeight", 0, 5000, 10).name("目标高度 (m)");
            floodFolder.add(this.params, "speed", 10, 500, 10).name("淹没速度 (m/s)");
            floodFolder.add(this.params, "direction", { 上升: "up", 下降: "down" }).name("方向");

            // ---- 颜色 ----
            let colorFolder = myLilGui.addFolder("淹没颜色");
            colorFolder.addColor(this.params, "color").name("水体颜色")
              .onChange(() => {
                if (this.analysis && this.analysis.polygonEntity) {
                  this.analysis.polygonEntity[0].polygon.material = this.toCesiumColor(this.params.color, 0.47);
                }
              });

            // ---- 操作 ----
            let controlFolder = myLilGui.addFolder("操作");
            controlFolder.add({ start: () => this.startAnalysis() }, "start").name("开始淹没");
            controlFolder.add({ clear: () => this.clearAll() }, "clear").name("清除");
            controlFolder.add({ fly: () => this.resetCamera() }, "fly").name("重置视角");

            // ---- 水面高度拖拽 ----
            let heightFolder = myLilGui.addFolder("水面高度");
            heightFolder.add(this.params, "currentHeight", 0, 5000, 1)
              .name("当前高度 (m)")
              .listen()
              .onChange((value) => {
                if (this.analysis && this.analysis.polygonEntity) {
                  this.analysis.waterHeight = value;
                }
              });
          },

          // ============================================================
          // 矩形绘制（参考 slope_analysis.html）
          // ============================================================

          startRectangleDraw() {
            this.clearAnalysis();
            this.cancelDraw();
            this.removePreview();
            this.firstCartesian = null;
            this.currentRectangle = null;
            this.currentPolygonCoords = null;
            this.statusText = "请左键点击第一个角点。";

            let handler = new Cesium.ScreenSpaceEventHandler(this.viewer.scene.canvas);
            this.drawHandler = handler;

            handler.setInputAction((click) => {
              let cartesian = this.pickGlobe(click.position);
              if (!cartesian) return;

              if (!this.firstCartesian) {
                this.firstCartesian = cartesian;
                this.statusText = "请移动鼠标并点击第二个对角点。";
                handler.setInputAction((movement) => {
                  this.drawPendingPos = movement.endPosition;
                  if (!this.drawRafId) {
                    this.drawRafId = requestAnimationFrame(() => {
                      this.drawRafId = null;
                      if (!this.drawPendingPos) return;
                      let end = this.pickGlobe(this.drawPendingPos);
                      this.drawPendingPos = null;
                      if (!end) return;
                      let rect = this.rectangleFromTwoCartesians(this.firstCartesian, end);
                      this.updatePreview(rect);
                    });
                  }
                }, Cesium.ScreenSpaceEventType.MOUSE_MOVE);
              } else {
                let rect = this.rectangleFromTwoCartesians(this.firstCartesian, cartesian);
                this.currentRectangle = Cesium.Rectangle.clone(rect);
                this.cancelDraw();
                this.removePreview();
                this.showFinalPreview(this.currentRectangle);
                this.statusText = "范围绘制完成。";

                // 矩形 → 多边形坐标（SW → SE → NE → NW → SW 闭合）
                let r = this.currentRectangle;
                this.currentPolygonCoords = [
                  Cesium.Math.toDegrees(r.west), Cesium.Math.toDegrees(r.south),
                  Cesium.Math.toDegrees(r.east), Cesium.Math.toDegrees(r.south),
                  Cesium.Math.toDegrees(r.east), Cesium.Math.toDegrees(r.north),
                  Cesium.Math.toDegrees(r.west), Cesium.Math.toDegrees(r.north),
                  Cesium.Math.toDegrees(r.west), Cesium.Math.toDegrees(r.south),
                ];

                if (this.params.autoAnalyze) {
                  this.startAnalysis();
                }
              }
            }, Cesium.ScreenSpaceEventType.LEFT_CLICK);
          },

          pickGlobe(position) {
            let ray = this.viewer.camera.getPickRay(position);
            if (!ray) return null;
            return this.viewer.scene.globe.pick(ray, this.viewer.scene);
          },

          rectangleFromTwoCartesians(start, end) {
            let c1 = Cesium.Cartographic.fromCartesian(start);
            let c2 = Cesium.Cartographic.fromCartesian(end);
            let west = Math.min(c1.longitude, c2.longitude);
            let east = Math.max(c1.longitude, c2.longitude);
            let south = Math.min(c1.latitude, c2.latitude);
            let north = Math.max(c1.latitude, c2.latitude);
            return new Cesium.Rectangle(west, south, east, north);
          },

          updatePreview(rectangle) {
            if (!this.previewEntity) {
              this.previewEntity = this.viewer.entities.add({
                rectangle: {
                  coordinates: new Cesium.CallbackProperty(() => {
                    return this.currentPreviewRectangle || rectangle;
                  }, false),
                  material: Cesium.Color.CYAN.withAlpha(0.18),
                  outline: true,
                  outlineColor: Cesium.Color.CYAN,
                  heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
                  classificationType: Cesium.ClassificationType.TERRAIN,
                },
              });
            }
            this.currentPreviewRectangle = Cesium.Rectangle.clone(rectangle);
            this.previewEntity.show = true;
          },

          showFinalPreview(rectangle) {
            this.removePreview();
            this.previewEntity = this.viewer.entities.add({
              rectangle: {
                coordinates: rectangle,
                material: Cesium.Color.CYAN.withAlpha(0.15),
                outline: true,
                outlineColor: Cesium.Color.WHITE,
                outlineWidth: 2,
                heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
                classificationType: Cesium.ClassificationType.TERRAIN,
              },
            });
          },

          removePreview() {
            if (this.previewEntity) {
              this.viewer.entities.remove(this.previewEntity);
              this.previewEntity = null;
            }
            this.currentPreviewRectangle = null;
          },

          cancelDraw() {
            if (this.drawRafId) {
              cancelAnimationFrame(this.drawRafId);
              this.drawRafId = null;
            }
            this.drawPendingPos = null;
            if (this.drawHandler) {
              this.drawHandler.destroy();
              this.drawHandler = null;
            }
            this.firstCartesian = null;
          },

          // ============================================================
          // 淹没分析
          // ============================================================

          // lil-gui 颜色值 0-1 → Cesium.Color
          toCesiumColor(rgb, alpha) {
            return new Cesium.Color(rgb[0], rgb[1], rgb[2], alpha);
          },

          startAnalysis() {
            if (!this.currentPolygonCoords) {
              this.statusText = "请先绘制淹没区域。";
              return;
            }

            // 清除旧分析
            if (this.analysis) {
              this.analysis.clear();
              this.analysis = null;
            }
            this.params.currentHeight = 0;

            let color = this.toCesiumColor(this.params.color, 0.47);

            this.analysis = new SubmergenceAnalysis({
              viewer: this.viewer,
              targetHeight: this.params.targetHeight,
              startHeight: this.params.startHeight,
              adapCoordi: this.currentPolygonCoords,
              speed: this.params.speed,
              changetype: this.params.direction,
              color: color,
              speedCallback: (h) => {
                this.params.currentHeight = Math.round(h);
              },
              endCallback: () => {
                this.isRunning = false;
                this.statusText = "淹没分析完成。";
              },
            });

            this.isRunning = true;
            this.analysis.start();
            this.statusText = "淹没分析运行中...";
          },

          clearAnalysis() {
            if (this.analysis) {
              this.analysis.clear();
              this.analysis = null;
            }
            this.params.currentHeight = 0;
            this.isRunning = false;
          },

          clearAll() {
            this.cancelDraw();
            this.clearAnalysis();
            this.removePreview();
            this.currentRectangle = null;
            this.currentPolygonCoords = null;
            this.statusText = "已清除，点击「绘制淹没区域」重新开始。";
          },

          resetCamera() {
            if (!this.viewer) return;
            this.viewer.camera.setView({
              destination: Cesium.Cartesian3.fromDegrees(102.2, 29.6, 10000),
              orientation: {
                heading: Cesium.Math.toRadians(0),
                pitch: Cesium.Math.toRadians(-20),
                roll: Cesium.Math.toRadians(0),
              },
            });
          },
        },
      }).mount("#app");
    </script>
  </body>
</html>
