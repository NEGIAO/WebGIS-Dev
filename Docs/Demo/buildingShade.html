<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>白膜材质切换</title>
		<script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"></script>
		<link
			href="https://cdn.jsdelivr.net/npm/cesium@1.140.0/Build/Cesium/Widgets/widgets.css"
			rel="stylesheet"
		/>
		<style type="text/css">
html, body, #app, #cesiumContainer {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #000;
}

.lil-gui {
  position: absolute;
  top: 10px;
  right: 10px;
  z-index: 999;
}

.toast {
  position: absolute;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(15, 23, 42, 0.85);
  backdrop-filter: blur(8px);
  color: #e2e8f0;
  font-size: 13px;
  padding: 8px 18px;
  border-radius: 8px;
  border: 1px solid rgba(168, 85, 247, 0.3);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s;
  z-index: 1000;
}

.toast.show {
  opacity: 1;
}
</style>
	</head>
	<body>
		<div id="app">
			<div id="cesiumContainer"></div>
			<div class="toast" id="toast"></div>
		</div>

		<script type="module">
			window.CESIUM_BASE_URL =
				"https://cdn.jsdelivr.net/npm/cesium@1.140.0/Build/Cesium/";
			const { createApp } = Vue;
			import * as Cesium from "https://cdn.jsdelivr.net/npm/cesium@1.140.0/+esm";
			import GUI from "https://cdn.jsdelivr.net/npm/lil-gui@0.19.1/dist/lil-gui.esm.js";

			const imagerySources = {
				ESRI影像: {
					url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
				},
				灰色地图: {
					url: "https://thematic.geoq.cn/arcgis/rest/services/ChinaOnlineStreetGray/MapServer/tile/{z}/{y}/{x}",
				},
			};
			const imageryNames = Object.keys(imagerySources);

			let toastTimer = null;
			function showToast(msg) {
				const el = document.getElementById("toast");
				el.textContent = msg;
				el.classList.add("show");
				clearTimeout(toastTimer);
				toastTimer = setTimeout(() => el.classList.remove("show"), 2500);
			}

			createApp({
				data() {
					return {
						viewer: null,
						tileset: null,
						state: {
							imagery: "ESRI影像",
							material: "heightStyle",
							resetCamera: () => this.doResetCamera(),
						},
					};
				},
				async mounted() {
					const viewer = this.initMap();
					this.buildGui();
					await this.add3DTileset(viewer);
				},
				methods: {
					initMap() {
						const viewer = new Cesium.Viewer("cesiumContainer", {
							baseLayer: false,
							animation: false,
							timeline: false,
							fullscreenButton: false,
							infoBox: false,
							geocoder: false,
							homeButton: false,
							sceneModePicker: false,
							baseLayerPicker: false,
							navigationHelpButton: false,
							selectionIndicator: false,
							shouldAnimate: true,
						});
						window.viewer = viewer;
						viewer.scene.debugShowFramesPerSecond = true;
						viewer.scene.globe.enableLighting = false;
						viewer.scene.fog.enabled = true;
						viewer.scene.fog.density = 0.00008;
						viewer.scene.skyAtmosphere.show = true;
						viewer._cesiumWidget._creditContainer.style.display = "none";

						viewer.imageryLayers.addImageryProvider(
							new Cesium.UrlTemplateImageryProvider({
								url: imagerySources["ESRI影像"].url,
								maximumLevel: 18,
							}),
						);
						this.viewer = viewer;
						this.doResetCamera();
						return viewer;
					},

					switchImagery(name) {
						const src = imagerySources[name];
						let url = src.url;
						if (src.token)
							url += (url.includes("?") ? "&" : "?") + "tk=" + src.token;
						const provider = new Cesium.UrlTemplateImageryProvider({ url });
						this.viewer.imageryLayers.removeAll(false);
						this.viewer.imageryLayers.addImageryProvider(provider, 0);
						showToast(`底图切换至：${name}`);
					},

					doResetCamera() {
						if (!this.viewer) return;
						this.viewer.camera.setView({
							destination: Cesium.Cartesian3.fromDegrees(
								120.592886,
								32.470705,
								20000000,
							),
							orientation: {
								heading: 0.0,
								pitch: Cesium.Math.toRadians(-90.0),
								roll: 0,
							},
						});
						showToast("视角已重置");
					},

					async add3DTileset(viewer) {
						try {
							const tileset = await Cesium.Cesium3DTileset.fromUrl(
								"./data/tileset/city/tileset.json",
								{ maximumScreenSpaceError: 10, maximumMemoryUsage: 5120 },
							);
							this.tileset = tileset;
							viewer.scene.primitives.add(tileset);
							this.applyMaterial(this.state.material);
							await viewer.zoomTo(tileset);
							const center = tileset.boundingSphere.center;
							this.setNoonLighting(center);
							showToast("3D Tileset 加载成功");
						} catch (err) {
							console.warn("3D Tileset 加载失败:", err.message);
							showToast("3D Tileset 加载失败，请检查资源路径");
						}
					},

					setNoonLighting(centerCartesian) {
						const scene = this.viewer.scene;
						const up = Cesium.Cartesian3.normalize(
							centerCartesian,
							new Cesium.Cartesian3(),
						);
						const ref =
							Math.abs(Cesium.Cartesian3.dot(up, Cesium.Cartesian3.UNIT_Z)) >
							0.99
								? Cesium.Cartesian3.UNIT_X
								: Cesium.Cartesian3.UNIT_Z;
						const east = Cesium.Cartesian3.normalize(
							Cesium.Cartesian3.cross(up, ref, new Cesium.Cartesian3()),
							new Cesium.Cartesian3(),
						);
						const zenith = Cesium.Math.toRadians(30);
						const direction = new Cesium.Cartesian3();
						Cesium.Cartesian3.multiplyByScalar(
							up,
							-Math.cos(zenith),
							direction,
						);
						const hComp = Cesium.Cartesian3.multiplyByScalar(
							east,
							Math.sin(zenith),
							new Cesium.Cartesian3(),
						);
						Cesium.Cartesian3.add(direction, hComp, direction);
						scene.light = new Cesium.DirectionalLight({
							direction,
							color: Cesium.Color.WHITE,
							intensity: 2.0,
						});
						scene.globe.enableLighting = false;
						if (scene.sun) scene.sun.show = false;
					},

					applyMaterial(mode) {
						if (!this.tileset) return;
						this.tileset.customShader = this.buildShader(mode);
						this.tileset.style =
							mode === "heightStyle" ? this.buildHeightStyle() : undefined;
						if (mode === "heightStyle") this.dumpFirstFeatureProps();
						const labels = {
							heightStyle: "高度分层",
							none: "原始材质",
							baimo: "白膜贴图",
							gradient: "高度渐变",
							pureWhite: "纯白膜",
						};
						showToast(`材质切换至：${labels[mode] || mode}`);
					},

					buildHeightStyle() {
						return new Cesium.Cesium3DTileStyle({
							color: {
								conditions: [
									["${height} === null", "color('rgb(44, 49, 88)')"],
									["${height} === undefined", "color('rgb(44, 49, 88)')"],
									["isNaN(Number(${height}))", "color('rgb(44, 49, 88)')"],
									["Number(${height}) >= 130", "color('rgb(195, 21, 21)')"],
									["Number(${height}) >= 60", "color('rgb(195, 83, 0)')"],
									["Number(${height}) >= 30", "color('rgb(73, 52, 140)')"],
									["true", "color('rgb(44, 49, 88)')"],
								],
							},
						});
					},

					buildShader(mode) {
						if (mode === "none" || mode === "heightStyle") return null;

						if (mode === "pureWhite") {
							return new Cesium.CustomShader({
								lightingModel: Cesium.LightingModel.UNLIT,
								fragmentShaderText: `
                  void fragmentMain(FragmentInput fsInput, inout czm_modelMaterial material) {
                    material.diffuse = vec3(0.95, 0.95, 0.95);
                    material.alpha = 1.0;
                  }`,
							});
						}

						if (mode === "baimo") {
							return new Cesium.CustomShader({
								lightingModel: Cesium.LightingModel.UNLIT,
								varyings: { v_normalMC: Cesium.VaryingType.VEC3 },
								uniforms: {
									u_texture: {
										value: new Cesium.TextureUniform({
											url: "./textures/building7.png",
										}),
										type: Cesium.UniformType.SAMPLER_2D,
									},
								},
								vertexShaderText: `
                  void vertexMain(VertexInput vsInput, inout czm_modelVertexOutput vsOutput) {
                    v_normalMC = vsInput.attributes.normalMC;
                  }`,
								fragmentShaderText: `
                  void fragmentMain(FragmentInput fsInput, inout czm_modelMaterial material) {
                    vec3 positionMC = fsInput.attributes.positionMC;
                    if (dot(vec3(0.0, 0.0, 1.0), v_normalMC) > 0.95) {
                      material.diffuse = vec3(0.079, 0.107, 0.111);
                    } else {
                      float width = 100.0, height = 100.0;
                      float dotXAxis = dot(vec3(0.0, 1.0, 0.0), v_normalMC);
                      float textureX = (dotXAxis > 0.52 || dotXAxis < -0.52)
                        ? mod(positionMC.x, width) / width
                        : mod(positionMC.y, width) / width;
                      float textureY = mod(positionMC.z, height) / height;
                      material.diffuse = texture(u_texture, vec2(textureX, textureY)).rgb;
                    }
                  }`,
							});
						}

						if (mode === "gradient") {
							return new Cesium.CustomShader({
								vertexShaderText: `
                  void vertexMain(VertexInput vsInput, inout czm_modelVertexOutput vsOutput) {}`,
								fragmentShaderText: `
                  void fragmentMain(FragmentInput fsInput, inout czm_modelMaterial material) {
                    float bottomHeight = 560.0, topHeight = 750.0;
                    float heightRatio = clamp(
                      (fsInput.attributes.positionMC.z - bottomHeight) / (topHeight - bottomHeight),
                      0.0, 1.0);
                    material.diffuse = mix(vec3(0.0, 0.8, 0.0), vec3(0.8, 0.0, 0.0), heightRatio);
                  }`,
							});
						}
						return null;
					},

					dumpFirstFeatureProps() {
						const handler = new Cesium.ScreenSpaceEventHandler(
							this.viewer.scene.canvas,
						);
						showToast("请点击一栋建筑查看属性（控制台）");
						handler.setInputAction((evt) => {
							const picked = this.viewer.scene.pick(evt.position);
							if (picked instanceof Cesium.Cesium3DTileFeature) {
								const names = picked.getPropertyIds();
								const dump = {};
								names.forEach((n) => (dump[n] = picked.getProperty(n)));
								console.warn("[高度分层] feature 属性：", dump);
								handler.destroy();
							}
						}, Cesium.ScreenSpaceEventType.LEFT_CLICK);
					},

					buildGui() {
						const gui = new GUI({ title: "白膜材质切换" });
						gui
							.add(this.state, "imagery", imageryNames)
							.name("底图")
							.onChange((name) => this.switchImagery(name));
						gui
							.add(this.state, "material", {
								高度分层: "heightStyle",
								原始材质: "none",
								白膜贴图: "baimo",
								高度渐变: "gradient",
								纯白膜: "pureWhite",
							})
							.name("材质")
							.onChange((mode) => this.applyMaterial(mode));
						gui.add(this.state, "resetCamera").name("重置视角");
					},
				},
			}).mount("#app");
		</script>
	</body>
</html>
