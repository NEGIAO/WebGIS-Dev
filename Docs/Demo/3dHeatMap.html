<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>3D 热力图</title>
		<script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/cesium@1.127.0/Build/Cesium/Cesium.js"></script>
		<link
			href="https://cdn.jsdelivr.net/npm/cesium@1.127.0/Build/Cesium/Widgets/widgets.css"
			rel="stylesheet"
		/>
		<style>
			html,
			body,
			#app,
			#cesiumContainer {
				width: 100%;
				height: 100%;
				margin: 0;
				padding: 0;
				overflow: hidden;
				background: #000;
			}

			.lil-gui {
				position: absolute;
				top: 10px;
				left: 10px;
				z-index: 999;
			}
		</style>
	</head>
	<body>
		<div id="app">
			<div id="cesiumContainer"></div>
		</div>

		<script type="module">
			import GUI from "https://cdn.jsdelivr.net/npm/lil-gui@0.19.1/dist/lil-gui.esm.js";

			// ==================== heatmap.js 核心 ====================

			const HeatmapConfig = {
				defaultRadius: 40,
				defaultRenderer: "canvas2d",
				defaultGradient: {
					0.25: "rgb(0,0,255)",
					0.55: "rgb(0,255,0)",
					0.85: "yellow",
					1.0: "rgb(255,0,0)",
				},
				defaultMaxOpacity: 1,
				defaultMinOpacity: 0,
				defaultBlur: 0.85,
				defaultXField: "x",
				defaultYField: "y",
				defaultValueField: "value",
				plugins: {},
			};

			class Store {
				constructor(config) {
					this._coordinator = {};
					this._data = [];
					this._radi = [];
					this._min = 0;
					this._max = 1;
					this._xField = config["xField"] || config.defaultXField;
					this._yField = config["yField"] || config.defaultYField;
					this._valueField = config["valueField"] || config.defaultValueField;
					if (config["radius"]) {
						this._cfgRadius = config["radius"];
					}
				}

				_organiseData(dataPoint, forceRender) {
					const x = dataPoint[this._xField];
					const y = dataPoint[this._yField];
					const radi = this._radi;
					const store = this._data;
					const max = this._max;
					const min = this._min;
					const value = dataPoint[this._valueField] || 1;
					const radius =
						dataPoint.radius || this._cfgRadius || HeatmapConfig.defaultRadius;

					if (!store[x]) {
						store[x] = [];
						radi[x] = [];
					}
					if (!store[x][y]) {
						store[x][y] = value;
						radi[x][y] = radius;
					} else {
						store[x][y] += value;
					}
					if (store[x][y] > max) {
						if (!forceRender) {
							this._max = store[x][y];
						} else {
							this.setDataMax(store[x][y]);
						}
						return false;
					} else {
						return { x, y, value, radius, min, max };
					}
				}

				_unOrganizeData() {
					const unorganizedData = [];
					const data = this._data;
					const radi = this._radi;
					for (const x in data) {
						for (const y in data[x]) {
							unorganizedData.push({
								x,
								y,
								radius: radi[x][y],
								value: data[x][y],
							});
						}
					}
					return { min: this._min, max: this._max, data: unorganizedData };
				}

				_onExtremaChange() {
					this._coordinator.emit("extremachange", {
						min: this._min,
						max: this._max,
					});
				}

				addData() {
					if (arguments[0].length > 0) {
						const dataArr = arguments[0];
						let dataLen = dataArr.length;
						while (dataLen--) {
							this.addData.call(this, dataArr[dataLen]);
						}
					} else {
						const organisedEntry = this._organiseData(arguments[0], true);
						if (organisedEntry) {
							this._coordinator.emit("renderpartial", {
								min: this._min,
								max: this._max,
								data: [organisedEntry],
							});
						}
					}
					return this;
				}

				setData(data) {
					const dataPoints = data.data;
					const pointsLen = dataPoints.length;
					this._data = [];
					this._radi = [];
					for (let i = 0; i < pointsLen; i++) {
						this._organiseData(dataPoints[i], false);
					}
					this._max = data.max;
					this._min = data.min || 0;
					this._onExtremaChange();
					this._coordinator.emit("renderall", this._getInternalData());
					return this;
				}

				setDataMax(max) {
					this._max = max;
					this._onExtremaChange();
					this._coordinator.emit("renderall", this._getInternalData());
					return this;
				}

				setDataMin(min) {
					this._min = min;
					this._onExtremaChange();
					this._coordinator.emit("renderall", this._getInternalData());
					return this;
				}

				setCoordinator(coordinator) {
					this._coordinator = coordinator;
				}

				_getInternalData() {
					return {
						max: this._max,
						min: this._min,
						data: this._data,
						radi: this._radi,
					};
				}

				getData() {
					return this._unOrganizeData();
				}
			}

			class Canvas2dRenderer {
				constructor(config) {
					const container = config.container;
					const shadowCanvas = (this.shadowCanvas =
						document.createElement("canvas"));
					const canvas = (this.canvas =
						config.canvas || document.createElement("canvas"));
					this._renderBoundaries = [10000, 10000, 0, 0];
					const computed = getComputedStyle(config.container) || {};

					canvas.className = "heatmap-canvas";
					this._width =
						canvas.width =
						shadowCanvas.width =
							+computed.width.replace(/px/, "");
					this._height =
						canvas.height =
						shadowCanvas.height =
							+computed.height.replace(/px/, "");

					this.shadowCtx = shadowCanvas.getContext("2d");
					this.ctx = canvas.getContext("2d");

					canvas.style.cssText = shadowCanvas.style.cssText =
						"position:absolute;left:0;top:0;";
					container.style.position = "relative";
					container.appendChild(canvas);

					this._palette = Canvas2dRenderer._getColorPalette(config);
					this._templates = {};
					this._setStyles(config);
				}

				static _getColorPalette(config) {
					const gradientConfig = config.gradient || config.defaultGradient;
					const paletteCanvas = document.createElement("canvas");
					const paletteCtx = paletteCanvas.getContext("2d");
					paletteCanvas.width = 256;
					paletteCanvas.height = 1;
					const gradient = paletteCtx.createLinearGradient(0, 0, 256, 1);
					for (const key in gradientConfig) {
						gradient.addColorStop(key, gradientConfig[key]);
					}
					paletteCtx.fillStyle = gradient;
					paletteCtx.fillRect(0, 0, 256, 1);
					return paletteCtx.getImageData(0, 0, 256, 1).data;
				}

				static _getPointTemplate(radius, blurFactor) {
					const tplCanvas = document.createElement("canvas");
					const tplCtx = tplCanvas.getContext("2d");
					const x = radius;
					const y = radius;
					tplCanvas.width = tplCanvas.height = radius * 2;
					if (blurFactor === 1) {
						tplCtx.beginPath();
						tplCtx.arc(x, y, radius, 0, 2 * Math.PI, false);
						tplCtx.fillStyle = "rgba(0,0,0,1)";
						tplCtx.fill();
					} else {
						const gradient = tplCtx.createRadialGradient(
							x,
							y,
							radius * blurFactor,
							x,
							y,
							radius,
						);
						gradient.addColorStop(0, "rgba(0,0,0,1)");
						gradient.addColorStop(1, "rgba(0,0,0,0)");
						tplCtx.fillStyle = gradient;
						tplCtx.fillRect(0, 0, 2 * radius, 2 * radius);
					}
					return tplCanvas;
				}

				static _prepareData(data) {
					const renderData = [];
					const min = data.min;
					const max = data.max;
					const radi = data.radi;
					const d = data.data;
					const xValues = Object.keys(d);
					let xValuesLen = xValues.length;
					while (xValuesLen--) {
						const xValue = xValues[xValuesLen];
						const yValues = Object.keys(d[xValue]);
						let yValuesLen = yValues.length;
						while (yValuesLen--) {
							const yValue = yValues[yValuesLen];
							const value = d[xValue][yValue];
							const radius = radi[xValue][yValue];
							renderData.push({ x: xValue, y: yValue, value, radius });
						}
					}
					return { min, max, data: renderData };
				}

				renderPartial(data) {
					this._drawAlpha(data);
					this._colorize();
				}

				renderAll(data) {
					this._clear();
					this._drawAlpha(Canvas2dRenderer._prepareData(data));
					this._colorize();
				}

				_updateGradient(config) {
					this._palette = Canvas2dRenderer._getColorPalette(config);
				}

				updateConfig(config) {
					if (config["gradient"]) {
						this._updateGradient(config);
					}
					this._setStyles(config);
				}

				setDimensions(width, height) {
					this._width = width;
					this._height = height;
					this.canvas.width = this.shadowCanvas.width = width;
					this.canvas.height = this.shadowCanvas.height = height;
				}

				_clear() {
					this.shadowCtx.clearRect(0, 0, this._width, this._height);
					this.ctx.clearRect(0, 0, this._width, this._height);
				}

				_setStyles(config) {
					this._blur =
						config.blur === 0 ? 0 : config.blur || config.defaultBlur;
					if (config.backgroundColor) {
						this.canvas.style.backgroundColor = config.backgroundColor;
					}
					this._opacity = (config.opacity || 0) * 255;
					this._maxOpacity =
						(config.maxOpacity || config.defaultMaxOpacity) * 255;
					this._minOpacity =
						(config.minOpacity || config.defaultMinOpacity) * 255;
					this._useGradientOpacity = !!config.useGradientOpacity;
				}

				_drawAlpha(data) {
					const min = (this._min = data.min);
					const max = (this._max = data.max);
					const d = data.data || [];
					let dataLen = d.length;
					const blur = 1 - this._blur;

					while (dataLen--) {
						const point = d[dataLen];
						const x = point.x;
						const y = point.y;
						const radius = point.radius;
						const value = Math.min(point.value, max);
						const rectX = x - radius;
						const rectY = y - radius;

						let tpl;
						if (!this._templates[radius]) {
							this._templates[radius] = tpl =
								Canvas2dRenderer._getPointTemplate(radius, blur);
						} else {
							tpl = this._templates[radius];
						}

						this.shadowCtx.globalAlpha = (value - min) / (max - min);
						this.shadowCtx.drawImage(tpl, rectX, rectY);

						if (rectX < this._renderBoundaries[0])
							this._renderBoundaries[0] = rectX;
						if (rectY < this._renderBoundaries[1])
							this._renderBoundaries[1] = rectY;
						if (rectX + 2 * radius > this._renderBoundaries[2])
							this._renderBoundaries[2] = rectX + 2 * radius;
						if (rectY + 2 * radius > this._renderBoundaries[3])
							this._renderBoundaries[3] = rectY + 2 * radius;
					}
				}

				_colorize() {
					let x = this._renderBoundaries[0];
					let y = this._renderBoundaries[1];
					let width = this._renderBoundaries[2] - x;
					let height = this._renderBoundaries[3] - y;
					const maxWidth = this._width;
					const maxHeight = this._height;
					const opacity = this._opacity;
					const maxOpacity = this._maxOpacity;
					const minOpacity = this._minOpacity;
					const useGradientOpacity = this._useGradientOpacity;

					if (x < 0) x = 0;
					if (y < 0) y = 0;
					if (x + width > maxWidth) width = maxWidth - x;
					if (y + height > maxHeight) height = maxHeight - y;

					const img = this.shadowCtx.getImageData(x, y, width, height);
					const imgData = img.data;
					const len = imgData.length;
					const palette = this._palette;

					for (let i = 3; i < len; i += 4) {
						const alpha = imgData[i];
						const offset = alpha * 4;
						if (!offset) continue;

						let finalAlpha;
						if (opacity > 0) {
							finalAlpha = opacity;
						} else {
							if (alpha < maxOpacity) {
								finalAlpha = alpha < minOpacity ? minOpacity : alpha;
							} else {
								finalAlpha = maxOpacity;
							}
						}

						imgData[i - 3] = palette[offset];
						imgData[i - 2] = palette[offset + 1];
						imgData[i - 1] = palette[offset + 2];
						imgData[i] = useGradientOpacity ? palette[offset + 3] : finalAlpha;
					}

					Object.defineProperty(img, "data", {
						value: imgData,
						writable: true,
						configurable: true,
						enumerable: true,
					});
					this.ctx.putImageData(img, x, y);
					this._renderBoundaries = [1000, 1000, 0, 0];
				}

				getValueAt(point) {
					const img = this.shadowCtx.getImageData(point.x, point.y, 1, 1);
					const data = img.data[3];
					const max = this._max;
					const min = this._min;
					return (Math.abs(max - min) * (data / 255)) >> 0;
				}

				getDataURL() {
					return this.canvas.toDataURL();
				}
			}

			class Coordinator {
				constructor() {
					this.cStore = {};
				}
				on(evtName, callback, scope) {
					if (!this.cStore[evtName]) this.cStore[evtName] = [];
					this.cStore[evtName].push((data) => callback.call(scope, data));
				}
				emit(evtName, data) {
					const cStore = this.cStore;
					if (cStore[evtName]) {
						const len = cStore[evtName].length;
						for (let i = 0; i < len; i++) {
							cStore[evtName][i](data);
						}
					}
				}
			}

			class Heatmap {
				constructor(config) {
					config = Object.assign({}, HeatmapConfig, config || {});
					this._config = config;
					this._coordinator = new Coordinator();
					if (config["plugin"]) {
						const pluginToLoad = config["plugin"];
						if (!HeatmapConfig.plugins[pluginToLoad]) {
							throw new Error(`Plugin '${pluginToLoad}' not found.`);
						} else {
							const plugin = HeatmapConfig.plugins[pluginToLoad];
							this._renderer = new plugin.renderer(config);
							this._store = new plugin.store(config);
						}
					} else {
						this._renderer = new Canvas2dRenderer(config);
						this._store = new Store(config);
					}
					this._connect();
				}

				_connect() {
					const renderer = this._renderer;
					const coordinator = this._coordinator;
					const store = this._store;
					coordinator.on("renderpartial", renderer.renderPartial, renderer);
					coordinator.on("renderall", renderer.renderAll, renderer);
					coordinator.on("extremachange", (data) => {
						this._config.onExtremaChange &&
							this._config.onExtremaChange({
								min: data.min,
								max: data.max,
								gradient:
									this._config["gradient"] || this._config["defaultGradient"],
							});
					});
					store.setCoordinator(coordinator);
				}

				addData() {
					this._store.addData.apply(this._store, arguments);
					return this;
				}
				setData() {
					this._store.setData.apply(this._store, arguments);
					return this;
				}
				setDataMax() {
					this._store.setDataMax.apply(this._store, arguments);
					return this;
				}
				setDataMin() {
					this._store.setDataMin.apply(this._store, arguments);
					return this;
				}
				configure(config) {
					this._config = Object.assign(this._config, config);
					this._renderer.updateConfig(this._config);
					this._coordinator.emit("renderall", this._store._getInternalData());
					return this;
				}
				repaint() {
					this._coordinator.emit("renderall", this._store._getInternalData());
					return this;
				}
				getData() {
					return this._store.getData();
				}
				getDataURL() {
					return this._renderer.getDataURL();
				}
				getValueAt(point) {
					if (this._store.getValueAt) return this._store.getValueAt(point);
					else if (this._renderer.getValueAt)
						return this._renderer.getValueAt(point);
					return null;
				}
			}

			const heatmapFactory = {
				create(config) {
					return new Heatmap(config);
				},
				register(pluginKey, plugin) {
					HeatmapConfig.plugins[pluginKey] = plugin;
				},
			};

			// ==================== 3D 热力图函数 ====================

			function cartesiansToLnglats(cartesians) {
				if (!cartesians || cartesians.length < 1) return;
				const coordinates = [];
				for (let i = 0; i < cartesians.length; i++) {
					const cartographic = Cesium.Cartographic.fromCartesian(cartesians[i]);
					coordinates.push([
						Cesium.Math.toDegrees(cartographic.longitude),
						Cesium.Math.toDegrees(cartographic.latitude),
						cartographic.height,
					]);
				}
				return coordinates;
			}

			function computeBoundingBox(positions, heatmapState) {
				if (!positions) return;
				const boundingSphere = Cesium.BoundingSphere.fromPoints(
					positions,
					new Cesium.BoundingSphere(),
				);
				const centerPoint = boundingSphere.center;
				const sphereRadius = boundingSphere.radius;

				const modelMatrix = Cesium.Transforms.eastNorthUpToFixedFrame(
					centerPoint.clone(),
				);
				const yAxisVector = new Cesium.Cartesian3(0, 1, 0);

				const boundingVertices = [];
				for (let angle = 45; angle <= 360; angle += 90) {
					const rotationMatrix = Cesium.Matrix3.fromRotationZ(
						Cesium.Math.toRadians(angle),
						new Cesium.Matrix3(),
					);
					let rotatedYAxis = Cesium.Matrix3.multiplyByVector(
						rotationMatrix,
						yAxisVector,
						new Cesium.Cartesian3(),
					);
					rotatedYAxis = Cesium.Cartesian3.normalize(
						rotatedYAxis,
						new Cesium.Cartesian3(),
					);
					const scaledVector = Cesium.Cartesian3.multiplyByScalar(
						rotatedYAxis,
						sphereRadius,
						new Cesium.Cartesian3(),
					);
					const vertex = Cesium.Matrix4.multiplyByPoint(
						modelMatrix,
						scaledVector.clone(),
						new Cesium.Cartesian3(),
					);
					boundingVertices.push(vertex);
				}

				const coordinates = cartesiansToLnglats(boundingVertices);
				let minLatitude = Number.MAX_VALUE,
					maxLatitude = Number.MIN_VALUE,
					minLongitude = Number.MAX_VALUE,
					maxLongitude = Number.MIN_VALUE;
				const vertexCount = boundingVertices.length;

				coordinates.forEach((coordinate) => {
					if (coordinate[0] < minLongitude) minLongitude = coordinate[0];
					if (coordinate[0] > maxLongitude) maxLongitude = coordinate[0];
					if (coordinate[1] < minLatitude) minLatitude = coordinate[1];
					if (coordinate[1] > maxLatitude) maxLatitude = coordinate[1];
				});

				const latitudeRange = maxLatitude - minLatitude;
				const longitudeRange = maxLongitude - minLongitude;

				heatmapState.boundingRect = {
					minLatitude: minLatitude - latitudeRange / vertexCount,
					maxLatitude: maxLatitude + latitudeRange / vertexCount,
					minLongitude: minLongitude - longitudeRange / vertexCount,
					maxLongitude: maxLongitude + longitudeRange / vertexCount,
				};

				heatmapState.boundingBox = {
					leftTop: Cesium.Cartesian3.fromDegrees(
						heatmapState.boundingRect.minLongitude,
						heatmapState.boundingRect.maxLatitude,
					),
					leftBottom: Cesium.Cartesian3.fromDegrees(
						heatmapState.boundingRect.minLongitude,
						heatmapState.boundingRect.minLatitude,
					),
					rightTop: Cesium.Cartesian3.fromDegrees(
						heatmapState.boundingRect.maxLongitude,
						heatmapState.boundingRect.maxLatitude,
					),
					rightBottom: Cesium.Cartesian3.fromDegrees(
						heatmapState.boundingRect.maxLongitude,
						heatmapState.boundingRect.minLatitude,
					),
				};

				heatmapState.xAxis = Cesium.Cartesian3.normalize(
					Cesium.Cartesian3.subtract(
						heatmapState.boundingBox.rightTop,
						heatmapState.boundingBox.leftTop,
						new Cesium.Cartesian3(),
					),
					new Cesium.Cartesian3(),
				);
				heatmapState.yAxis = Cesium.Cartesian3.normalize(
					Cesium.Cartesian3.subtract(
						heatmapState.boundingBox.leftBottom,
						heatmapState.boundingBox.leftTop,
						new Cesium.Cartesian3(),
					),
					new Cesium.Cartesian3(),
				);
				heatmapState.xAxisLength = Cesium.Cartesian3.distance(
					heatmapState.boundingBox.rightTop,
					heatmapState.boundingBox.leftTop,
				);
				heatmapState.yAxisLength = Cesium.Cartesian3.distance(
					heatmapState.boundingBox.leftBottom,
					heatmapState.boundingBox.leftTop,
				);
			}

			function computeNormalizedCoordinates(position, heatmapState) {
				if (!position) return;
				const cartographic = Cesium.Cartographic.fromCartesian(
					position.clone(),
				);
				cartographic.height = 0;
				position = Cesium.Cartographic.toCartesian(cartographic.clone());

				const originVector = Cesium.Cartesian3.subtract(
					position.clone(),
					heatmapState.boundingBox.leftTop,
					new Cesium.Cartesian3(),
				);
				const xOffset = Cesium.Cartesian3.dot(originVector, heatmapState.xAxis);
				const yOffset = Cesium.Cartesian3.dot(originVector, heatmapState.yAxis);
				return {
					x: Number(
						(
							(xOffset / heatmapState.xAxisLength) *
							heatmapState.canvasWidth
						).toFixed(0),
					),
					y: Number(
						(
							(yOffset / heatmapState.yAxisLength) *
							heatmapState.canvasWidth
						).toFixed(0),
					),
				};
			}

			function generateMeshData(heatmapState) {
				const gridWidth = heatmapState.canvasWidth || 200;
				const gridHeight = heatmapState.canvasWidth || 200;
				const { maxLongitude, maxLatitude, minLongitude, minLatitude } =
					heatmapState.boundingRect;
				const is3D = heatmapState.is3DMode !== false;

				const longitudeStep = (maxLongitude - minLongitude) / gridWidth;
				const latitudeStep = (maxLatitude - minLatitude) / gridHeight;
				const positions = [];
				const textureCoords = [];
				const indices = [];

				for (let i = 0; i < gridWidth; i++) {
					const currentLongitude = minLongitude + longitudeStep * i;
					for (let j = 0; j < gridHeight; j++) {
						const currentLatitude = minLatitude + latitudeStep * j;
						const heatValue = heatmapState.heatmapInstance.getValueAt({
							x: i,
							y: j,
						});
						const elevation = is3D
							? heatmapState.baseElevation + heatValue * 0.1
							: heatmapState.baseElevation;
						const cartesian3 = Cesium.Cartesian3.fromDegrees(
							currentLongitude,
							currentLatitude,
							elevation,
						);
						positions.push(cartesian3.x, cartesian3.y, cartesian3.z);
						textureCoords.push(i / gridWidth, j / gridHeight);
						if (j !== gridHeight - 1 && i !== gridWidth - 1) {
							indices.push(
								i * gridHeight + j,
								i * gridHeight + j + 1,
								(i + 1) * gridHeight + j,
							);
							indices.push(
								(i + 1) * gridHeight + j,
								(i + 1) * gridHeight + j + 1,
								i * gridHeight + j + 1,
							);
						}
					}
				}

				return { positions, textureCoords, indices };
			}

			function createHeatmapGeometry(heatmapState) {
				const meshData = generateMeshData(heatmapState);
				const geometry = new Cesium.Geometry({
					attributes: new Cesium.GeometryAttributes({
						position: new Cesium.GeometryAttribute({
							componentDatatype: Cesium.ComponentDatatype.DOUBLE,
							componentsPerAttribute: 3,
							values: meshData.positions,
						}),
						st: new Cesium.GeometryAttribute({
							componentDatatype: Cesium.ComponentDatatype.FLOAT,
							componentsPerAttribute: 2,
							values: new Float32Array(meshData.textureCoords),
						}),
					}),
					indices: new Uint16Array(meshData.indices),
					primitiveType: Cesium.PrimitiveType[heatmapState.primitiveType],
					boundingSphere: Cesium.BoundingSphere.fromVertices(
						meshData.positions,
					),
				});
				return geometry;
			}

			function createHeatmapContainer(heatmapState) {
				heatmapState.containerElement = window.document.createElement("div");
				heatmapState.containerElement.id = `heatmap-${heatmapState.instanceId}`;
				heatmapState.containerElement.className = "heatmap";
				heatmapState.containerElement.style.width = `${heatmapState.canvasWidth}px`;
				heatmapState.containerElement.style.height = `${heatmapState.canvasWidth}px`;
				heatmapState.containerElement.style.position = "absolute";
				heatmapState.containerElement.style.display = "none";

				const mapContainer = heatmapState.viewer.container;
				mapContainer.appendChild(heatmapState.containerElement);
			}

			function initializeHeatmap(heatmapState) {
				for (const dataPoint of heatmapState.dataPoints) {
					const cartesianPosition = Cesium.Cartesian3.fromDegrees(
						dataPoint.lnglat[0],
						dataPoint.lnglat[1],
						0,
					);
					heatmapState.positionHierarchy.push(cartesianPosition);
				}

				computeBoundingBox(heatmapState.positionHierarchy, heatmapState);

				const heatmapPoints = heatmapState.positionHierarchy.map((position, index) => {
					const normalizedCoords = computeNormalizedCoordinates(
						position,
						heatmapState,
					);
					return {
						x: normalizedCoords.x,
						y: normalizedCoords.y,
						value: heatmapState.dataPoints[index].value,
					};
				});

				heatmapState.heatmapInstance.setData({
					max: Math.max(...heatmapPoints.map((p) => p.value)),
					data: heatmapPoints,
				});

				const geometryInstance = new Cesium.GeometryInstance({
					geometry: createHeatmapGeometry(heatmapState),
				});

				heatmapState.heatmapPrimitive =
					heatmapState.viewer.scene.primitives.add(
						new Cesium.Primitive({
							geometryInstances: geometryInstance,
							appearance: new Cesium.MaterialAppearance({
								material: new Cesium.Material({
									fabric: {
										type: "Image",
										uniforms: {
											image: heatmapState.heatmapInstance.getDataURL(),
										},
									},
								}),
								vertexShaderSource:
									heatmapState.is3DMode !== false
										? /* glsl */ `
                      in vec3 position3DHigh;
                      in vec3 position3DLow;
                      in vec2 st;
                      in float batchId;
                      uniform sampler2D image_0;
                      out vec3 v_positionEC;
                      in vec3 normal;
                      out vec3 v_normalEC;
                      out vec2 v_st;
                      void main(){
                          vec4 p = czm_computePosition();
                          v_normalEC = czm_normal * normal;
                          v_positionEC = (czm_modelViewRelativeToEye * p).xyz;
                          vec4 positionWC = czm_inverseModelView * vec4(v_positionEC, 1.0);
                          v_st = st;
                          vec4 color = texture(image_0, v_st);
                          vec3 upDir = normalize(positionWC.xyz);
                          p += vec4(color.r * upDir * 1000.0, 0.0);
                          gl_Position = czm_modelViewProjectionRelativeToEye * p;
                      }`
										: /* glsl */ `
                      in vec3 position3DHigh;
                      in vec3 position3DLow;
                      in vec2 st;
                      in float batchId;
                      uniform sampler2D image_0;
                      out vec3 v_positionEC;
                      in vec3 normal;
                      out vec3 v_normalEC;
                      out vec2 v_st;
                      void main(){
                          vec4 p = czm_computePosition();
                          v_normalEC = czm_normal * normal;
                          v_positionEC = (czm_modelViewRelativeToEye * p).xyz;
                          v_st = st;
                          gl_Position = czm_modelViewProjectionRelativeToEye * p;
                      }`,
								translucent: true,
								flat: true,
							}),
							asynchronous: false,
						}),
					);
				heatmapState.heatmapPrimitive.id = "heatmap3d";
			}

			function destroyHeatmap(heatmapState) {
				const containerElement = document.getElementById(
					`heatmap-${heatmapState.instanceId}`,
				);
				if (containerElement) containerElement.remove();
				if (heatmapState.heatmapPrimitive) {
					heatmapState.viewer.scene.primitives.remove(
						heatmapState.heatmapPrimitive,
					);
					heatmapState.heatmapPrimitive = undefined;
				}
			}

			function updateHeatmapTexture(heatmapState) {
				if (!(heatmapState.heatmapPrimitive && heatmapState.heatmapInstance))
					return;
				heatmapState.heatmapPrimitive.appearance.material.uniforms.image =
					heatmapState.heatmapInstance.getDataURL();
			}

			function create3DHeatmap(viewer, options = {}) {
				const heatmapState = {
					viewer,
					options,
					dataPoints: options.dataPoints || [],
					containerElement: undefined,
					instanceId: Number(
						`${new Date().getTime()}${Number(
							(Math.random() * 1000).toFixed(0),
						)}`,
					),
					canvasWidth: 200,
					boundingBox: undefined,
					boundingRect: {},
					xAxis: undefined,
					yAxis: undefined,
					xAxisLength: 0,
					yAxisLength: 0,
					baseElevation: options.baseElevation || 0,
					is3DMode: options.is3DMode !== false,
					heatmapPrimitive: undefined,
					positionHierarchy: [],
					heatmapInstance: null,
				};

				if (!heatmapState.dataPoints || heatmapState.dataPoints.length < 3) {
					console.warn("热力图点位不得少于3个！");
					return null;
				}

				createHeatmapContainer(heatmapState);

				const heatmapConfig = {
					container: document.getElementById(
						`heatmap-${heatmapState.instanceId}`,
					),
					radius: options.radius || 20,
					maxOpacity: 0.7,
					minOpacity: 0,
					blur: 0.75,
					gradient: options.colorGradient || {
						".1": "blue",
						".5": "yellow",
						".7": "red",
						".99": "white",
					},
				};

				heatmapState.primitiveType = options.primitiveType || "TRIANGLES";
				heatmapState.heatmapInstance = heatmapFactory.create(heatmapConfig);

				initializeHeatmap(heatmapState);

				return {
					destroy: () => destroyHeatmap(heatmapState),
					update: () => updateHeatmapTexture(heatmapState),
					heatmapState,
				};
			}

			// ==================== Vue 应用 ====================

			const { createApp } = Vue;

			createApp({
				data() {
					return {
						viewer: null,
						heatmap3D: null,
						cachedPoints: null,
						gui: null,
						params: {
							is3DMode: true,
							pointCount: 80,
							radius: 20,
							baseElevation: 0,
							heatScale: 1000,
						},
					};
				},
				mounted() {
						this.initMap();
						this.buildHeatmap();
					this.initGui();
				},
				beforeUnmount() {
					if (this.gui) {
						this.gui.destroy();
						this.gui = null;
					}
					if (this.heatmap3D) {
						this.heatmap3D.destroy();
						this.heatmap3D = null;
					}
				},
				methods: {
					initMap() {
						const viewer = new Cesium.Viewer("cesiumContainer", {
							baseLayer: false,
							animation: false,
							timeline: false,
							fullscreenButton: false,
							infoBox: false,
							geocoder: false,
							homeButton: false,
							sceneModePicker: false,
							baseLayerPicker: false,
							navigationHelpButton: false,
							selectionIndicator: false,
							shouldAnimate: true,
						});

						window.viewer = viewer;
						viewer.scene.debugShowFramesPerSecond = true;
						viewer.scene.globe.enableLighting = false;
						viewer.scene.fog.enabled = true;
						viewer.scene.fog.density = 0.00008;
						viewer.scene.skyAtmosphere.show = true;
						viewer._cesiumWidget._creditContainer.style.display = "none";

						viewer.imageryLayers.addImageryProvider(
							new Cesium.UrlTemplateImageryProvider({
								url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
								maximumLevel: 18,
							}),
						);

						this.viewer = viewer;
						this.resetCamera();
						return viewer;
					},

					// 生成模拟数据点
					generatePoints(count, scale) {
						return new Array(count).fill("").map(() => ({
							lnglat: [
								116.46 + Math.random() * 0.1 * (Math.random() > 0.5 ? 1 : -1),
								39.92 + Math.random() * 0.1 * (Math.random() > 0.5 ? 1 : -1),
							],
							value: scale * Math.random(),
						}));
					},

					// 重新生成随机点
					regeneratePoints() {
						this.cachedPoints = this.generatePoints(
							this.params.pointCount,
							this.params.heatScale,
						);
						this.buildHeatmap();
					},

					buildHeatmap() {
						if (
							!this.cachedPoints ||
							this.cachedPoints.length !== this.params.pointCount
						) {
							this.cachedPoints = this.generatePoints(
								this.params.pointCount,
								this.params.heatScale,
							);
						}

						const oldHeatmap = this.heatmap3D;
						this.heatmap3D = create3DHeatmap(this.viewer, {
							dataPoints: this.cachedPoints,
							radius: this.params.radius,
							baseElevation: this.params.baseElevation,
							is3DMode: this.params.is3DMode,
							primitiveType: "TRIANGLES",
							colorGradient: {
								".3": "blue",
								".5": "green",
								".7": "yellow",
								".95": "red",
							},
						});

						if (oldHeatmap) {
							oldHeatmap.destroy();
						}
					},

					initGui() {
						const gui = new GUI({ title: "3D 热力图" });
						this.gui = gui;

						gui
							.add(this.params, "is3DMode")
							.name("3D 模式")
							.onChange(() => this.buildHeatmap());

						gui
							.add(this.params, "pointCount", 10, 200, 10)
							.name("点位数量")
							.onChange(() => this.buildHeatmap());

						gui
							.add(this.params, "radius", 5, 60, 1)
							.name("热力半径")
							.onChange(() => this.buildHeatmap());

						gui
							.add(this.params, "baseElevation", 0, 5000, 100)
							.name("基础高度")
							.onChange(() => this.buildHeatmap());

						gui
							.add(this.params, "heatScale", 100, 5000, 100)
							.name("热力强度")
							.onChange(() => this.buildHeatmap());

						gui
							.add({ refresh: () => this.regeneratePoints() }, "refresh")
							.name("重新生成");

						gui
							.add({ resetCamera: () => this.resetCamera() }, "resetCamera")
							.name("重置视角");
					},

					resetCamera() {
						if (!this.viewer) return;
						this.viewer.camera.flyTo({
							destination: Cesium.Cartesian3.fromDegrees(116.46, 39.32, 80000),
							orientation: {
								heading: Cesium.Math.toRadians(0),
								pitch: Cesium.Math.toRadians(-45),
								roll: 0,
							},
							duration: 2,
						});
					},
				},
			}).mount("#app");
		</script>
	</body>
</html>
