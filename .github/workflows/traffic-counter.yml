name: Update Traffic Stats

on:
  schedule:
    # 建议避开 UTC 0 点的高峰期，改为 UTC 2 点（北京时间上午 10 点）执行
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  traffic:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # 创建 PR 与 gh pr merge --auto 需要写 PR 权限（PAT 自身的权限同样要够）
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch and save traffic data
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.TRAFFIC_TOKEN }}
          script: |
            const fs = require('fs');
            const path = '.github/traffic.json';

            // ========================
            // 1. 默认数据结构
            // ========================
            let data = {
              totalViews: 0,
              totalUniqueViews: 0,
              totalClones: 0,
              totalUniqueClones: 0,
              lastUpdate: '',
              lastCountedDate: '',
              daily: {}
            };

            // ========================
            // 2. 读取旧数据（兼容旧版本）
            // ========================
            if (fs.existsSync(path)) {
              const content = fs.readFileSync(path, 'utf8');
              if (content) {
                try {
                  const oldData = JSON.parse(content);
                  data = { ...data, ...oldData };
                } catch (e) {
                  console.log('JSON parse error, using default data');
                }
              }
            }

            // 字段兜底（防止 undefined 报错）
            data.totalViews = data.totalViews || 0;
            data.totalUniqueViews = data.totalUniqueViews || 0;
            data.totalClones = data.totalClones || 0;
            data.totalUniqueClones = data.totalUniqueClones || 0;
            data.lastUpdate = data.lastUpdate || '';
            data.lastCountedDate = data.lastCountedDate || '';
            if (!data.daily) data.daily = {};

            // ========================
            // 3. 获取 GitHub API 数据
            // ========================
            const views = await github.request('GET /repos/{owner}/{repo}/traffic/views', {
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const clones = await github.request('GET /repos/{owner}/{repo}/traffic/clones', {
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            // ========================
            // 4. 获取“大前天”及其之前遗漏的日期 (T-3)
            // GitHub traffic API 通常会延迟，因此始终以 UTC 大前天为截止日期。
            // ========================
            const targetDate = new Date();
            targetDate.setUTCHours(0, 0, 0, 0);
            targetDate.setUTCDate(targetDate.getUTCDate() - 3);
            const targetDateStr = targetDate.toISOString().slice(0, 10);

            let nextDateStr = targetDateStr;
            if (data.lastCountedDate) {
              const lastCounted = new Date(`${data.lastCountedDate}T00:00:00Z`);
              if (!Number.isNaN(lastCounted.getTime())) {
                lastCounted.setUTCDate(lastCounted.getUTCDate() + 1);
                nextDateStr = lastCounted.toISOString().slice(0, 10);
              }
            }

            // ========================
            // 5. 初始化（仅第一次）
            //    总量取 API 的 14 天聚合值，daily 只做存档，不再累加，避免重复。
            // ========================
            const isFirstRun = !data.lastUpdate;
            if (isFirstRun) {
              console.log('First run detected. Initializing data from past 14 days.');
              data.totalViews = Number(views.data.count) || 0;
              data.totalUniqueViews = Number(views.data.uniques) || 0;
              data.totalClones = Number(clones.data.count) || 0;
              data.totalUniqueClones = Number(clones.data.uniques) || 0;
              const allDates = [...new Set([...viewsByDate.keys(), ...clonesByDate.keys()])].sort();
              for (const dateStr of allDates) data.daily[dateStr] = readBucket(dateStr);
            }

            // ========================
            // 6. 防重复统计与逐日累加（核心）
            // 从上次计数日期的下一天，一直处理到当前可用的截止日期。
            // 已存在于 daily 中的日期不会重复累加；每天必须被处理后才推进 lastCountedDate。
            // ========================
            if (isFirstRun) {
              nextDateStr = targetDateStr;
            }

            const cursor = new Date(`${nextDateStr}T00:00:00Z`);
            const cutoff = new Date(`${targetDateStr}T00:00:00Z`);

            if (!Number.isNaN(cursor.getTime()) && !Number.isNaN(cutoff.getTime())) {
              for (; cursor <= cutoff; cursor.setUTCDate(cursor.getUTCDate() + 1)) {
                const dateStr = cursor.toISOString().slice(0, 10);
                if (data.daily[dateStr]) {
                  console.log(`Data for ${dateStr} already recorded. Skipping addition.`);
                } else {
                  const viewsObj = views.data.views.find(v => v.timestamp.startsWith(dateStr));
                  const clonesObj = clones.data.clones.find(c => c.timestamp.startsWith(dateStr));

                  const dayViews = viewsObj ? viewsObj.count : 0;
                  const dayUniqueViews = viewsObj ? viewsObj.uniques : 0;
                  const dayClones = clonesObj ? clonesObj.count : 0;
                  const dayUniqueClones = clonesObj ? clonesObj.uniques : 0;

                  if (!isFirstRun) {
                    data.totalViews += dayViews;
                    data.totalUniqueViews += dayUniqueViews;
                    data.totalClones += dayClones;
                    data.totalUniqueClones += dayUniqueClones;
                  }

                  data.daily[dateStr] = {
                    views: dayViews,
                    uniqueViews: dayUniqueViews,
                    clones: dayClones,
                    uniqueClones: dayUniqueClones
                  };
                  console.log(`Counted ${dateStr}: views=${dayViews}, clones=${dayClones}`);
                }
              }

              data.lastCountedDate = targetDateStr;
            }

            // 只在目标日期更靠后时推进，避免时钟回拨导致游标倒退
            if (data.lastCountedDate < targetDateStr) data.lastCountedDate = targetDateStr;

            data.lastUpdate = new Date().toISOString();

            // ========================
            // 7. 写入文件
            // ========================
            const dir = '.github';
            if (!fs.existsSync(dir)) fs.mkdirSync(dir);

            fs.writeFileSync(path, JSON.stringify(data, null, 2));

      # 不再直接推送 main（受保护分支要求 Build & Test Check，直推会被 GH006 拒绝）。
      # 改为开 PR，让 pre-check.yml 的 Build & Test Check 跑起来，检查通过后自动合并。
      - name: Create PR for traffic data
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          # 必须用 PAT：GITHUB_TOKEN 创建的 PR 不会触发 pull_request 工作流，
          # 也就不会触发 Build & Test Check，auto-merge 会一直卡住。
          token: ${{ secrets.TRAFFIC_TOKEN }}
          add-paths: '.github/traffic.json'
          commit-message: 'chore: update traffic statistics [auto]'
          branch: automation/traffic-stats
          delete-branch: true
          title: 'chore: 自动更新访问统计'
          body: |
            由 .github/workflows/traffic-counter.yml 自动创建。
            `Build & Test Check` 通过后由 auto-merge 自动 squash 合并。
          labels: automation

      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number
        run: gh pr merge --auto --squash "${{ steps.cpr.outputs.pull-request-url }}"
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
