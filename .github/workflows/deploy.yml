name: FullStack Build & Multi-Deploy

on:
  push:
    branches: [ main ]
    # 监听main分支的推送事件，确保每次更新都会触发部署流程
  workflow_dispatch:

# 权限设置：允许读取仓库内容，允许写 Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

# 强制使用 Node.js 24 运行时（解决 Node.js 20 弃用警告）
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ==========================================
  # 第一步：构建 (Build)
  # ==========================================
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Vue Repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json' # 明确依赖路径

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      # Shader bundle 一致性门禁:仓库内提交的 bundledShaders.js / public 镜像
      # 必须与 Shaders/ 真源一致,漂移则失败并提示本地执行 npm run shaders。
      # (build 本身也会在 vite.config 求值时自动再生,此步用于把「忘同步」拦截在部署前)
      - name: Check shader bundle sync
        working-directory: ./frontend
        run: npm run shaders:check

      - name: Build Frontend Project
        working-directory: ./frontend
        run: npm run build
        # 此时生成了 dist 文件夹

      # 1. 为“自己”的 GitHub Pages 准备 artifact
      - name: Upload pages artifact (for self)
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

      # 2. 为“外部”的 Pages 仓库准备 artifact (普通文件)
      - name: Upload dist artifact (for external sync)
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: frontend/dist

  # ==========================================
  # 第二步：部署到 Vue 仓库自己的 Pages
  # ==========================================
  deploy-to-self:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # ==========================================
  # 第三步：同步到 NEGIAO.github.io中的WebGIS目录
  # （为posit connect cloud准备最新build版本并同步更新）
  # ==========================================
  sync-to-main-repo:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # 1. 下载构建好的 Vue 文件
      - name: Download built files
        uses: actions/download-artifact@v4
        with:
          name: dist-files
          path: dist-for-sync

      # 2. 逻辑：克隆主仓库 -> 删除原子目录 -> 放入新文件 -> 推送
      - name: Push to NEGIAO.github.io
        env:
          # Vue 仓库的 Secrets 里配置这个 Token 防止泄露，权限只给 NEGIAO.github.io 仓库的写权限
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          # --- 配置变量 ---
          TARGET_REPO="NEGIAO/NEGIAO.github.io"   # 主页仓库 (三件套)
          TARGET_BRANCH="main"                    # 主页仓库的分支
          TARGET_DIR="WebGIS"                     # Vue 项目在主页仓库里名字
                                                  # 最终访问路径会是: https://NEGIAO.github.io/WebGIS/

          # --- 设置 Git 用户 ---
          git config --global user.name "github-actions[bot]"
          git config --global user.email "actions@github.com"

          # --- 克隆主仓库 ---
          echo "Cloning target repo..."
          git clone --depth 1 --branch $TARGET_BRANCH "https://x-access-token:${DEPLOY_TOKEN}@github.com/${TARGET_REPO}.git" target_repo
          
          cd target_repo

          # --- 替换文件 ---
          echo "Updating subdirectory: ${TARGET_DIR}"
          
          # 如果目标目录存在，先清空 (保留目录结构，删除内容)
          # 这样可以确保旧版本的文件被清理掉
          if [ -d "$TARGET_DIR" ]; then
            rm -rf "$TARGET_DIR"
          fi
          
          mkdir -p "$TARGET_DIR"

          # 将下载的 dist 文件复制进去
          # ../dist-for-sync 是在上一步下载 artifact 的路径
          cp -R ../dist-for-sync/. "$TARGET_DIR/"

          # 创建 .nojekyll 防止下划线文件丢失
          touch "$TARGET_DIR/.nojekyll"

          # --- 提交并推送 ---
          echo "Committing changes..."
          git add --all
          
          if git diff --staged --quiet; then
            echo "No changes detected. Skipping push."
          else
            git commit -m "Update WebGIS from source repo: ${GITHUB_SHA::7}"
            echo "Pushing to ${TARGET_REPO}..."
            git push "https://x-access-token:${DEPLOY_TOKEN}@github.com/${TARGET_REPO}.git" $TARGET_BRANCH
          fi

# ==========================================
# 第四步：同步到 Hugging Face Static Space
# (仅前端构建产物 dist)
# ==========================================
  deploy-frontend-to-hf:
      needs: build
      runs-on: ubuntu-latest
      steps:
        - name: Download built files
          uses: actions/download-artifact@v4
          with:
            name: dist-files
            path: dist-to-hf

        - name: Push Static Dist with LFS to HF
          env:
            HF_TOKEN: ${{ secrets.HF_TOKEN }}
          run: |
            cd dist-to-hf

            # 1. 彻底删除所有大数量碎文件目录（瓦片和 3D Tiles）
            echo "Removing heavy tiles and 3dtiles..."
            rm -rf tiles/
            rm -rf tileset/
            rm -rf public/tileset/
            # 递归删除可能被 Vite 打包到 assets 或根目录下的 3dtiles 碎片
            find . -type d -name "*tileset*" -exec rm -rf {} + 2>/dev/null || true

            # 2. 初始化 Git 和 LFS
            git init
            git lfs install

            # 3. 追踪所有二进制文件为 LFS（覆盖 dist 中所有非文本资源）
            # 图片
            git lfs track "*.webp"
            git lfs track "*.png"
            git lfs track "*.jpg"
            git lfs track "*.jpeg"
            # 3D 模型与瓦片 (追加了 b3dm / i3dm / pnts / cmpt / geom)
            git lfs track "*.glb"
            git lfs track "*.gltf"
            git lfs track "*.b3dm"
            git lfs track "*.i3dm"
            git lfs track "*.pnts"
            git lfs track "*.cmpt"
            # 云纹理数据
            git lfs track "*.bin"
            # 地理数据（Vite 哈希重命名后的副本）
            git lfs track "assets/*.kmz"
            git lfs track "assets/*.kml"
            git lfs track "*.geojson"
            # 共享资源
            git lfs track "ShareData/**"
            # 图标
            git lfs track "*.ico"
            # WebAssembly 二进制（Cesium basis/draco/gaussian-splat 转码器；
            # HF 要求二进制文件必须走 LFS/Xet 存储，裸 blob 会被 pre-receive 拒绝）
            git lfs track "*.wasm"
            # GIF 动图（Cesium Widgets 内置 loading 动画等）
            git lfs track "*.gif"

            # 必须添加 .gitattributes 否则追踪不生效
            git add .gitattributes
            
            git config user.name "github-actions[bot]"
            git config user.email "actions@github.com"

            # 4. 注入元数据
            cat <<EOT > README.md
            ---
            title: WebGIS-Frontend
            emoji: 🚀
            sdk: static
            ---
            EOT

            # 5. 提交并推送
            git add .
            git commit -m "Update WebGIS frontend dist to Hugging Face: ${GITHUB_SHA::7}"
            
            echo "Pushing to Hugging Face..."
            git push --force "https://NEGIAO:${HF_TOKEN}@huggingface.co/spaces/NEGIAO/Web" master:main
            
# ==========================================
#   第五步：部署全栈到 Hugging Face Space（单容器：nginx + FastAPI）
#   （Space 根与仓库根同构：{Dockerfile, deploy/, backend/, frontend/}，
#    deploy/Dockerfile 内 COPY 路径在两侧完全一致）
# ==========================================
  sync-to-huggingface:
      needs: build
      runs-on: ubuntu-latest
      steps:
        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Verify fullstack build assets
          run: |
            echo "Checking fullstack build assets..."
            test -f deploy/Dockerfile             || (echo "Missing deploy/Dockerfile" && exit 1)
            test -f deploy/nginx.conf             || (echo "Missing deploy/nginx.conf" && exit 1)
            test -f deploy/.env                   || (echo "Missing deploy/.env (L1)" && exit 1)
            test -f backend/app.py                || (echo "Missing backend/app.py" && exit 1)
            test -f frontend/package-lock.json    || (echo "Missing frontend/package-lock.json" && exit 1)
            echo "All required fullstack build assets found ✓"

        # 组装 Space 上下文（git archive 只取已追踪文件 → 天然排除
        # node_modules/dist/tiles/.venv 等本地噪音；镜像内自行 npm ci + vite build）
        - name: Assemble HF Space context
          run: |
            rm -rf hf_deploy && mkdir hf_deploy
            git archive HEAD deploy backend frontend | tar -x -C hf_deploy
            # HF 约定 Dockerfile 位于 Space 根；路径语义与本仓库根一致。
            # BuildKit 按 <Dockerfile路径>.dockerignore 配对 → 必须同拷，
            # 否则白名单失效，stats.html/tileset 等噪音全部进入构建上下文
            cp deploy/Dockerfile hf_deploy/Dockerfile
            cp deploy/Dockerfile.dockerignore hf_deploy/Dockerfile.dockerignore
            cat > hf_deploy/README.md <<EOT
            ---
            title: WebGIS
            emoji: 🌍
            colorFrom: blue
            colorTo: green
            sdk: docker
            app_port: 7860
            pinned: false
            ---
            EOT

        - name: Track large binaries with LFS
          run: |
            cd hf_deploy
            git init -q
            git lfs install
            # HF 要求二进制走 LFS/Xet 存储，裸 blob 大文件会被 pre-receive 拒绝
            git lfs track "*.webp" "*.png" "*.jpg" "*.jpeg" "*.gif" "*.ico"
            git lfs track "*.glb" "*.gltf" "*.b3dm" "*.i3dm" "*.pnts" "*.cmpt"
            git lfs track "*.bin" "*.wasm" "*.geojson" "*.kmz" "*.kml"
            git lfs track "ShareData/**"

        - name: Push Fullstack to Hugging Face Space
          env:
            HF_TOKEN: ${{ secrets.HF_TOKEN }}
          run: |
            cd hf_deploy
            git add .gitattributes
            git config user.name "github-actions[bot]"
            git config user.email "actions@github.com"
            git add -A
            if git diff --staged --quiet; then
              echo "No changes detected. Skipping push."
              exit 0
            fi
            git commit -qm "deploy fullstack: ${GITHUB_SHA::7}"
            echo "Pushing fullstack to Hugging Face Spaces..."
            git push --force "https://NEGIAO:${HF_TOKEN}@huggingface.co/spaces/NEGIAO/WebGIS" HEAD:main
            echo "Fullstack deployment to Hugging Face completed ✓"