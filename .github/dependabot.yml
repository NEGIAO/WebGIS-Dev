version: 2

# ------------------------------------------------------------------
# Dependabot 更新策略：patch / minor 自动合并，major 人工看
# ------------------------------------------------------------------
# - patch / minor：由 .github/workflows/dependabot-automerge.yml 在
#   必过检查（PR Check / Build & Test Check）通过后自动 squash 合并。
# - major：只出 PR，不自动合并，需人工确认（API 变更风险高）。
# - 安全更新不受 schedule 约束，GitHub 收录新 advisory 后立刻开 PR。
# ------------------------------------------------------------------

updates:
  # ---------- 前端：npm ----------
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(deps)"

  # ---------- 后端：uv ----------
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python:uv"
    commit-message:
      prefix: "chore(deps)"
