version: 2

# Dependabot 版本更新策略
# 背景：此前仓库未配置本文件，仅靠 GitHub 的 security updates 被动触发，
# 导致版本更新与安全更新混在一起，且 uv 生态因 requires-python 配置错误长期失败。
# 本配置将 minor/patch 归组以减少 PR 噪音，major 仍单独出 PR 以便人工评估。

updates:
  # ---------- 前端：npm ----------
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # minor + patch 合并为一个 PR
      frontend-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      # 安全更新也归组，避免告警爆发时刷屏
      frontend-security:
        applies-to: security-updates
        patterns:
          - "*"

  # ---------- 后端：uv ----------
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python:uv"
    commit-message:
      prefix: "chore(deps)"
    groups:
      backend-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      backend-security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # 生产镜像固定 python:3.12-slim（deploy/Dockerfile），
      # 涉及 Python 版本下限变化的 major 升级需人工评估后再放开。
      - dependency-name: "pandas"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "numpy"
        update-types:
          - "version-update:semver-major"
