version: 2

# ────────────────────────────────────────────────────────────────
# Dependabot 更新策略：只跟大版本（major）
# ────────────────────────────────────────────────────────────────
# 背景：本仓库由 Agent 高频产出功能提交，依赖的 minor / patch 更新噪音过大。
# 关键点：**安全更新（security updates）不受 schedule 约束**——GitHub 收录新
# advisory 后立刻开 PR，表现为「每天冒出几个 PR」，与 schedule 的 weekly 无关。
# 策略：忽略所有依赖的 minor / patch，只保留 major 更新，按周检查。
#
# ⚠️ 取舍（务必知悉）：Dependabot 的 ignore 对 version-updates 与
# security-updates **同时生效**，因此 minor / patch 级别的安全补丁不再自动出 PR。
# 需要定期人工复查：https://github.com/NEGIAO/WebGIS-Dev/security/dependabot
# 若日后想恢复安全补丁，删掉下面两处 ignore 块即可。
# ────────────────────────────────────────────────────────────────

updates:
  # ---------- 前端：npm ----------
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    # 只跟 major，PR 极少，限额调低
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # 仅保留 major：minor / patch 一律不出 PR
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"

  # ---------- 后端：uv ----------
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "python:uv"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
