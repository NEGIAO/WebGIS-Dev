# =====================================================================
# WebGIS 全栈单容器 nginx 主配置（deploy/Dockerfile 内运行，非 root）
#
# 设计：前端基址在构建期已注入为「/」（同源相对路径），浏览器请求
#       /api/*、/proxy/*、/tiles/* 等即后端原生路径 —— 因此这里
#       对所有后端顶级段做【原样透传】，不做任何 URI 改写/解码，
#       瓦片代理中的百分号编码 URL 天然无损。
#
# 后端原生顶级段（来源：app.routes 实测）：
#   /api/  /proxy/  /tiles/  /monitor/  /health  /docs  /redoc  /openapi.json
#
# 运行身份：user(u1000) → pid/日志/临时目录全部指向 /tmp
# =====================================================================

pid /tmp/nginx.pid;
worker_processes auto;
error_log /tmp/nginx-error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;   # 已含 wasm 等 Cesium/GeoTIFF 所需 MIME
    default_type application/octet-stream;

    sendfile          on;
    tcp_nopush        on;
    keepalive_timeout 65;
    server_tokens     off;

    # 安全响应头（server 级默认；注意 nginx 继承规则——location 内出现任意
    # add_header 即整体失效，故 /assets/ 与瓦片段各自补齐）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options        SAMEORIGIN always;
    add_header Referrer-Policy        strict-origin-when-cross-origin always;

    # 非 root 可写临时目录
    client_body_temp_path /tmp/nginx_cache/client;
    proxy_temp_path       /tmp/nginx_cache/proxy;
    fastcgi_temp_path     /tmp/nginx_cache/fastcgi;
    uwsgi_temp_path       /tmp/nginx_cache/uwsgi;
    scgi_temp_path        /tmp/nginx_cache/scgi;

    # 空间分析/下载任务等 POST 可能携带数 MB GeoJSON/SHP
    client_max_body_size 64m;

    # ---------------------------------------------------------------
    # gzip：文本类全压；wasm 收益明显也一并压缩
    # ---------------------------------------------------------------
    gzip            on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_vary       on;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml
        application/wasm;

    access_log /tmp/nginx-access.log;

    # ---------------------------------------------------------------
    # 瓦片磁盘缓存（作用于下方 /tiles/ 与 /proxy/ 段）：
    #   - 失效策略 = 短 TTL：仅缓存 200、1 小时过期；纠偏参数/数据变更后
    #     最多陈旧 1h 自愈，无需主动清缓存（2026-08-24 选定方案①）
    #   - 忽略上游 Cache-Control/Expires，保证缓存行为确定性
    #   - 2GB LRU 上限；7 天未被访问的条目提前淘汰
    # ---------------------------------------------------------------
    proxy_cache_path /tmp/nginx_cache/tiles
                     levels=1:2
                     keys_zone=tiles:16m
                     max_size=2g
                     inactive=7d
                     use_temp_path=off;

    # ---------------------------------------------------------------
    server {
        listen 7860 default_server;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # -----------------------------------------------------------
        # 瓦片类透传（/tiles/ /proxy/：gcj2wgs、wgs2gcj 纠偏 + 通用瓦片代理，
        # 见 backend/api/proxy.py，全部 GET 幂等）
        #   - 命中热点瓦片时 nginx 直接吐盘，Python 进程零占用
        #   - 缓存要求开缓冲：本段 proxy_buffering on（区别于 api 段）
        #   - X-Cache 响应头暴露命中状态（MISS/HIT/EXPIRED）便于观测
        # -----------------------------------------------------------
        location ~ ^/(tiles|proxy)(/|$) {
            proxy_pass http://127.0.0.1:8000;

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";

            proxy_cache          tiles;
            proxy_cache_valid    200 1h;
            proxy_cache_key      "$scheme$request_method$host$request_uri";
            proxy_ignore_headers Cache-Control Expires;
            proxy_buffering      on;
            proxy_read_timeout   300s;
            proxy_send_timeout   300s;

            add_header X-Cache                     $upstream_cache_status always;
            add_header X-Content-Type-Options      nosniff always;
            add_header X-Frame-Options             SAMEORIGIN always;
            add_header Referrer-Policy             strict-origin-when-cross-origin always;
        }

        # -----------------------------------------------------------
        # 动态接口透传（公共参数模板）
        #   - 无 URI 的 proxy_pass → 原始请求路径原样转发（零改写）
        #   - SSE 兼容：关缓冲 + 长读超时 + HTTP/1.1 keepalive
        #   - /api/ /monitor/ 含流式与动态内容，明确不缓存
        # -----------------------------------------------------------
        location ~ ^/(api|monitor)(/|$) {
            proxy_pass http://127.0.0.1:8000;

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";

            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # 后端文档与健康检查（精确路径，避免被 SPA 回退吞掉）
        location = /health        { proxy_pass http://127.0.0.1:8000; }
        location = /openapi.json  { proxy_pass http://127.0.0.1:8000; }
        location = /redoc         { proxy_pass http://127.0.0.1:8000; }
        location ^~ /docs         { proxy_pass http://127.0.0.1:8000; }

        # -----------------------------------------------------------
        # 带内容哈希的构建产物：永久缓存（文件名变 = URL 变）
        # ^~ 优先于下方正则，避免被扩展名规则二次覆盖 add_header
        # -----------------------------------------------------------
        location ^~ /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # 入口页永远协商缓存（引用的哈希资源变了必须立刻拿到新 html）
        location = /index.html {
            add_header Cache-Control "no-cache";
        }
        location = / {
            try_files /index.html =404;
            add_header Cache-Control "no-cache";
        }

        # 其余静态数据（cesium/ cloud-atmosphere/ ShareData/ glb/ json/
        # images/ textures/ avatars/ tileset/ ...）：默认 ETag 协商缓存，
        # 本地替换文件刷新即生效，又不至于每次全量重拉

        # SPA 回退（hash 路由，此条仅为深链接直访兜底）
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
